body:
  text: 醫學集成卷一陰陽諸論陰陽一道始於一終於八伏羲畫之以開其淵源文王演之以神其變化故一而二陰陽判矣則對待之數出焉陰陽判天地位矣則主宰之理立焉天地位四時行而萬物生則知人之生生化化唯此陰陽而已所以卦有乾坤人有男女故曰乾道成男坤道成女乾道成男成於坎中之一陽也奇也坤道成女成於離中之二陰也偶也此陰陽奇偶之道誠生生不息之機也天地陰陽天地有陰陽日為太陽月為少陰此天之陰陽也水為太陰火為少陽此地之陰陽也是天非陰陽而無晦明地非陰陽而無消長天地非陰陽而失其清寧萬物非陰陽而無由生化則知天地非陰陽天地亦渾淪於無象之表陰陽無天地陰陽亦湮沒於太極之中此天地陰陽之道誠萬物生化之源也人身陰陽人身有陰陽即腎與命門所藏之真水真火是也真水者元陰也以長以立亦曰元精真火者元陽也以生以化亦曰元氣元精元氣者即人生化之元神也生氣通天唯原文為惟賴乎此至陰陽立命之基陰本於兩腎陽根於命門兩腎猶坎外之二分於命門之外命門猶坎中之一介乎兩腎之中故道家謂之丹田梁邱子謂之子戶醫者以精氣含於內謂之子宮男女媾精受命於中謂之命出入是門謂之門故曰命門命門者精氣之宅水火之家誠先天北闕後天祖基也人身陰陽之道學者所當究心也病有陰陽病有陰陽如畏熱為陽怯寒為陰在表為陽在裏為陰上病為陽下病為陰飲冷為陽飲熱為陰好動為陽好靜為陰喜明為陽喜暗為陰多言為陽不語為陰面赤為陽面黯為陰新病朝急者陽邪盛暮危者陰邪盛久病晝靜者陽虛夜安者陰虛至陰中有陽陽中有陰尤當細察藥有陰陽藥有陰陽當知宜忌桂附乾薑吳萸枸杞故紙巴戟鹿膠蓯蓉陽藥也陽虛寒盛六脈微遲者宜陰虛脈大者忌之生地龜膠白芍女貞丹皮知柏陰藥也陰虛熱盛六脈洪數者宜陽虛脈細者忌之麻黃桂枝細辛羌活川芎升麻味辛性升陽也寒邪在表內無煩渴六脈浮緊者宜熱邪在裏大煩大渴六脈洪滑或細數而陰虛者忌之大黃芒硝滑石芩連石膏味苦性降陰也熱邪在裏煩渴脹滿便結六脈洪滑鼓指者宜若口渴喜熱飲腹脹便不結或衰老久病脈微而陽虛者雖有前證尤宜忌之半夏生薑止嘔宜陰虛失血者忌之烏梅地榆止血宜表邪未清者忌之蒼朮葛根發表宜嘔吐者忌之童便當歸血分宜便溏者忌之香砂枳殼氣滯者宜氣弱者忌之柴胡白芥薄荷入肝家脅痛者宜表虛汗出者忌之藥性陰陽關係非小投之一錯殺人反掌可不畏哉陰虛證論陰虛者水虧其源如口渴咽焦引水自救或躁擾狂越欲臥泥中或五心煩熱而消疸骨蒸或二便祕結而溺如漿汁或吐血衄血咳嗽遺精或斑黃無汗者由津液之枯涸或中風瘛瘲瘛瘲筋脈痙攣者以精血之敗傷凡此皆無根之焰有因火不歸源皆陰不足以配陽病在陰中之水也王太僕云寒之不寒是無水也無水者壯水之主以制陽光如六味左歸飲丸之類是也陽虛證論陽虛者火衰其本火虧於下則陽衰於上或神氣昏沉或動履困倦或頭目眩暈而七竅偏廢咽喉哽噎而嘔惡氣短皆上焦之陽虛也有飲食不化而吞酸反胃痞滿膈塞而水泛為痰皆中焦之陽虛也有清濁不分而腸鳴滑泄陽痿精寒而臍腹多痛皆下焦之陽虛也又或畏寒灑灑火臟之陽虛不能禦寒也肌肉鼓脹土臟之陽虛不能制水也拘攣痛痹木臟之陽虛不能營筋也寒嗽虛喘身涼自汗金臟之陽虛不能保肺也精遺血泄二便失禁腰脊如折筋疼骨痛水臟之陽虛精髓內竭也凡此皆陽虛之證也王太僕云熱之不熱是無火也無火者益火之源以消陰翳如八味右歸飲丸之類是也先天解説兩腎為先天之本坎離寓焉坎居左腎坎中滿坎為中男上下二爻為坤陰中一爻為乾陽坎為水即先天真水中一爻為陽即先天真陽陰中有陽水中有火是也離居右腎離中虛離為中女上下二爻為乾陽中一爻為坤陰離為火即先天真火中一爻為陰即先天真陰陽中有陰火中有水是也修煉家謂龍從火裏出虎向水邊生此也後天解説後天脾胃氣血也戊己也戊為陽土己為陰土捷徑云刀圭足以延壽考係道家隱語戊字一丿即刀字這一丿也己字一𠃌即刀字這一𠃌也合而為刀圭字兩重土即戊土己土也合而為圭故曰刀圭丹田解説臍下寸半為氣海一寸八分為丹田淪淪渾渾如露珠如水泡順則成人逆則成仙保合太和長生不老道家謂之嬰兒佛家謂之舍利子醫家謂之丹田五行生克金木水火土為五行金生水水生木木生火火生土土生金為五行相生金克木木克土土克水水克火火克金為五行相克五臟六腑心肝脾肺腎為五臟膽胃小腸大腸膀胱三焦為六腑合心包絡為十二經臟腑表裏心與小腸為表裏心包絡與三焦為表裏肝與膽為表裏脾與胃為表裏肺與大腸為表裏腎與膀胱為表裏臟腑所屬心與小腸屬火心為丁火小腸為丙火肝與膽屬木肝為乙木膽為甲木脾與胃屬土脾為己土胃為戊土肺與大腸屬金肺為辛金大腸為庚金腎與膀胱屬水腎為癸水膀胱為壬水足六經辨太陽膀胱陽明胃少陽膽太陰脾少陰腎厥陰肝手六經辨太陽小腸陽明大腸少陽三焦太陰肺少陰心厥陰心包絡十二經絡手三陽從手至頭手三陰從臟至手足三陽從頭至足足三陰從足至腹太陽少陰行身之後陽明太陰行身之前少陽厥陰行身之側足經脈長遍絡四體手經脈短統在足經故傷寒外感但言足經不言手經寸關尺解以掌後高骨為關從關至魚際得一寸以寸名從關至尺澤得一尺以尺名以關為間隔尺寸不得混而為一家合寸關尺為三部六部脈解六部脈候以寸關尺左寸以候心左關以候肝左尺以候腎右寸以候肺右關以候脾右尺以候命門六部各有所屬究之精於六脈分而不分不分而分斯得訣矣脈定至數診脈之初先平自己呼吸以己之呼吸定他人之呼吸人之臟腑不可見於脈息見之脈來四至為緩即平人無病之脈拋去此部又考他部從六部中考其太過不及斯有權衡權衡者先看人之強弱後考脈之虛實千病萬病總不出陰陽表裏虛實六字再從六字細心探討則權衡定矣脈定權衡脈以緩字為權衡緩字探得熟能識諸症探得浮沉遲數四大脈真處則知緩字外即是病或浮或沉或遲或數不必盡具探得緩字在某部即知某部無病從病脈治之權衡得矣浮沉統屬崔氏從肉上行者為浮從肉下行者為沉浮而無力為濡沉而無力為弱浮沉有力中取無力為芤沉極至骨為伏浮極內空為革沉極內堅為牢浮中沉三部有力為實浮中沉三部無力為虛浮中沉三部無力按之且小似有似無為微浮中沉三部無力按之且大渙漫不收為散遲數統屬三至為遲六至為數四至為緩緩脈動時一止為結數脈動時一止為促結促之脈動而中止不能自還為代滑澀統屬滑溜如珠為滑往來澀滯為澀狀如弓弦按之且徑為弦彈搏人手為緊來時應指而盛去時減力而衰為洪細軟如絲為細來去迢迢而長為長來去縮縮而短為短圓如豆粒約約動搖不移為動諸脈主病浮為在表沉為在裏濡為陽虛弱為陰虛芤為失血伏為閉鬱革為傷精牢為堅積實為邪實虛為正虛此處原文實為邪虛實為正虛有誤微為陽憊散為虛極遲為臟寒數為腑熱緩為無病結為寒盛促為熱盛代為氣乏滑為痰病澀為血少弦為水飲緊為寒痛洪為脹熱細為氣少長為氣盛短為氣虛動為痛熱預卜生機四時之脈和緩為宗即有胃氣脈即有神方書以有力訓之不知有力即有神有神即有胃氣久病新病生機可蔔表裏解説表裏者邪在軀殼為表宜發散麻桂柴胡湯之類邪入臟腑為裏陰症宜溫熱解散理中四逆之類陽症宜清涼攻下諸承氣湯之類如表用裏藥裏用表藥陰症用陰藥陽症用陽藥是誅伐無辜脈分陰陽浮陽也沉陰也微陰也細陰也弦陽中陰也弱陰也濡陰也牢陰中陽也虛陰也實陽也滑陽中陰也澀陰也洪陽也伏陰也緩平和遲陰也數陽也芤陽中陰也革陰也結陰也促陽也長陽也短陰也緊陽也散陰也動陽也代陰也五運所化甲己化土乙庚化金丙辛化水丁壬化木戊癸化火如甲己之歲以土運統之余皆準此六氣分司一歲之中六氣分司各主六十日謂之主氣一之氣自大寒至驚蟄厥陰風木主之二之氣自春分至立夏少陰君火主之三之氣自小滿至小暑少陽相火主之四之氣自大暑至白露太陰濕土主之五之氣自秋分至立冬陽明燥金主之六之氣自小雪至小寒太陽寒水主之司天在泉司天主上半年六個月之令在泉主下半年六個月之令子午年少陰君火司天陽明燥金在泉卯酉年陽明燥金司天少陰君火在泉辰戌年太陽寒水司天太陰濕土在泉醜未年太陰濕土司天太陽寒水在泉寅申年少陽相火司天厥陰風木在泉巳亥年厥陰風木司天少陽相火在泉司天在泉歌司天者天之氣候也在泉者地之氣候也子午少陰君火天陽明燥金就在泉醜未太陰濕土上太陽寒水從下遷寅申少陽相火旺厥陰風木地中聯卯酉卻與子午倒辰戌巳亥亦皆然初氣地左二天右三為司天歲半周四為天左五地右終氣在泉歲半後手掌圖示附圖手掌圖示巳亥起厥陰順數到其年上看是何字即其年分之司天前二位是初氣一位是二氣本位司天三氣後一位四氣後二位五氣後三位在泉是終氣左掌圖熟記厥少太少陽太六字則六氣盡矣厥少太為三陰少陽太為三陽其法以巳亥為始即起厥陰司天故於巳亥位起厥字子午位為少字醜位為太字順數到底皆其年分之司天也其餘五氣循序可推矣值年用藥甲己之年丙作首丙火生土土喜乾燥而惡水濕藥宜辛燥之品乙庚之歲戊為頭戊土生金金喜清肅而惡火燥藥宜滋潤之品丙辛之年從庚起庚金生水水喜溫暖而惡寒凝藥宜溫暖之品丁壬壬上癸順流癸水生木木喜條達而惡抑鬱藥宜挑達之品戊癸翻從甲寅求甲木生火火喜升發而惡濕鬱藥宜清涼之品五行本體天地化生五行五行各秉一臟各得一氣各主一方各司一令各有所化各有所害東生風木司春令在人為肝肝氣不舒則病南生熱火司夏令在人為心心氣不舒則病長夏生濕土主四季在人為脾脾氣不舒則病西主燥金司秋令在人為肺肺氣不舒則病北主寒水司冬令在人為腎腎氣不舒則病此五行為病也更有母病及子者如金病移於腎子病及母者腎移病於肺有妻病乘夫者土病傳於肝夫病及妻者肝病傳於土有相生而傳者如金傳水水傳木木傳火火傳土土傳金有相克而傳者金傳木木傳土土傳水水傳火火傳金學者其留意焉望聞問切楊氏醫不難治病難於知病欲知病在望聞問切不明望聞問切何與神聖功巧是不知病矣不知病焉能治病夫望聞問切四字醫家入門之要領臨症之先著苟不究此如鏡花水月何由把捉故輯此以為入門臨證之助望色知順逆望者望其氣色即知順逆難易也凡諸風掉眩脅肋脹痛及小兒驚癇搐搦肝病也色青黃者順純白者逆脈弦緩者易獨澀者難顛狂無倫驚悸怔忡及大汗如雨心病也色赤黃者順純黑者逆脈洪緩者易獨細者難咳嗽喘急胸膈脹滿肺病也色黃白者順純赤者逆脈微緩者易獨大者難遺精盜汗骨蒸虛勞腎病也色蒼黃者順純黃者逆脈沉緩者易獨緊者難腫脹噎膈嘔吐吞酸脾胃病也色澤而黃者順純青者逆脈和緩者易獨弦者難至平人無病而面帶青黑者大災將臨赤白者亦不免於小恙此蓋與得之偶然者辨不與稟來之色同論也聞聲知虛實聞者聞其聲音即知病之虛實生死也外感之證在表者其聲壯厲當參浮脈主治第二條按四時散之此開門逐賊法也聲音懶怯而微當補而兼散氣虛補陰益氣煎血虛歸柴飲陰虛一柴胡飲陽虛理陰煎加減此養正除邪云蒸雨化法也腹脹膈塞喘急痰壅聲壯而促此邪正俱實須分輕重治之脹滿和胃飲膈塞神香散喘急蘇子降氣湯痰壅二陳湯此從治法也若證雖有餘其聲微短邪氣實而正氣虛也治宜求本脹滿膈塞理中湯理陰煎喘急痰壅貞元飲金水六君煎兼服腎氣丸此逆治法也至於內傷勞損頭目眩暈及困憊垂危等證其聲前重而後微者虛在腎而精不化氣也當補腎陽虛寒盛右歸飲右歸丸陰虛熱盛左歸飲左歸丸補精以化氣其聲初微而終顯者虛在肺而氣不生精也當補肺四君六君十全等湯補氣以生精若聲前後顯然中獨微者虛在脾補中湯壽脾煎速救中氣使上以化氣下以生精至以聲決生死尤屬易知如發言初微而終復者生始微而終絶者死言一句而相連者生一字一斷者死聲微而清長者生聲壯而類禽畜者死問證知標本一問寒熱先後即知寒熱真假也如寒在先熱在後仍欲飲熱則知水極似火格陽於外真寒假熱是寒為本熱為標也右歸飲加澤瀉涼服則寒熱均退矣如熱在先寒在後酷好飲冷則知火極似水格陰於外真熱假寒是熱為本寒為標也一陰煎加減斯寒熱悉除矣一問寒熱有朝暮以辨陰陽之虛實也如朝不寒而夜寒新病者陰邪勝也陰逢陰旺所以夜急理陰煎加麻黃以溫其寒久病者陽虛也陽得陽助所以朝輕其證必兼四肢厥冷臍腹寒痛治宜八味丸培陽若夜不熱而朝熱暴病者陽邪勝也陽逢陽旺所以晝甚一柴胡飲加減以散其熱久病者陰虛也陰遇陰扶所以夜寧其證必兼喘嗽煩躁遺淋失血治宜六味丸滋陰一問寒熱有止作否如止作無時則知元氣大虛正不勝邪宜八珍十全峻補氣血左歸右歸力培陰陽一問寒熱初起內無積滯便結外有六經形證此傷寒之寒熱也當閲傷寒門並浮脈主治第二條又或表證悉具身無痛楚此食積之寒熱也當閲浮脈主治第三條二問汗問有汗無汗也夫無汗為表實有汗為表虛人所共知也若寒從中生陰為陽拂脈沉疾頭身痛此寒凝於中未及於表或見汗出皆浮陽蒸化之汗非實邪汗也所以汗出而寒熱不解是豈有汗者盡為表虛乎宜理陰煎大加麻黃溫中解表汗從陰達邪自散矣又如外感風寒屢經發汗汗竟不出非表實也乃裏虛也血虛熱渴歸柴飲加葛根無熱渴理陰煎加麻黃氣虛兼寒大溫中飲補散兼施隨汗隨愈至大汗如雨氣血脫也八珍湯去川芎倍參歸朮如夢醒俱汗自汗也夢有汗醒無汗盜汗也均以一陰煎加山藥棗皮棗皮又名山茱萸山萸肉天目籽藥棗屬山茱萸科落葉小喬木當歸棗仁五味補之斂之如血從毛孔出血汗也乃血為火逼當歸六黃湯極效三問頭痛問其新久及朝夕止作也如暴病頭痛竟無休息外感頭痛也宜用辛散止作有時內傷頭痛也當辨陰陽朝痛夜止陰虛也治宜滋陰夜痛朝止陽虛也治宜培陽至痰厥偏正頭風當於頭痛門參治三問身痛身痛之病有三如暴病身痛兼頭痛發熱此風寒襲於經絡當按四時審虛實散之如無別病而獨言身痛此血不營經也獨歸酒兼服大營煎加附子如遇陰雨而痛此濕痛也五苓散加蒼朮羌活芎歸四問二便如大便溏泄小便清長但脈微弱即見脹滿慎勿攻伐惟以溫補脾腎為主理脾滌飲加故紙胡巴如大便閉結小水短赤證見諸火諸脹而六脈洪弦火加減一陰煎脹大和中飲五問飲食好惡多寡及化與不化也初病好冷惡熱此熱邪在裏法當清利純好熱飲此寒邪在裏法當溫中善食不化胃強脾弱也壽脾煎知飢而食不下脾強胃弱也溫胃飲善食易飢脾熱也一陰煎倍白芍惡食兼脹食積也平胃散或枳朮丸六問胸寬與不寬即知氣化與不化也如雜證初起胸膈脹痛肝鬱氣結也舒肝飲久病者理陰煎加茯苓白芥若傷寒汗下後四肢熱減惟胸熱如火元麥飲或陷胸湯如熱而兼脹大便仍結大柴胡湯至久病胸膈不寬必因脾虛不能化氣理脾滌飲凡治諸證方中必兼理脾脾健則氣化氣化則胸自寬矣七問耳聾如初傷風寒而聾寒在少陽經也小柴胡湯如無病而聾氣閉竅也六鬱湯加歸芍柴辛菖蒲至久病耳聾必屬腎虛陰虛左歸丸陽虛右歸丸俱兼服聰明益氣湯凡諸病兼耳聾隨治漸聞者順若不全應或絶無聞此精脫之症不可救矣八問渴與不渴即知裏證之寒熱也凡大渴恣飲冷水而又腹堅便結脈實氣壯此陽證也當大涼大下若口渴仍喜熱飲此中寒津竭也法當溫中加生津藥如渴不欲飲此真陰虧而津液涸乃口乾非渴也六味湯左歸飲以壯水亦有真陰虛而陽邪盛口亦乾渴炎燥右歸飲加人參澤瀉涼服或間進冷水此引火歸元從陰引陽之法也切脈要法凡診脈男左女右病人仰手醫者覆手凝神指下慎勿他思先以中指按病人大指三寸後高骨起處是為關脈討定關脈方下前後二指前為寸後為尺是為三部人長指宜疏排人矮指宜密排先以三指各輕於皮膚上候之謂之浮取略重於肌肉間候之謂之中取極力於筋骨下候之謂之沉取前指於寸部三候中指於關部三候後指於尺部三候三三合九是為九候九候之中以寸部候上焦病關部候中焦病尺部候下焦病浮取以候表沉取以候裏中取以候胃氣各臟各腑逐一推求則陰陽表裏寒熱虛實自了然於三指下矣脈義總論脈者血氣之神邪正之鑒也有諸內必形諸外故血氣盛者脈必盛血氣衰者脈必衰無病者脈必正有病者脈必乖病雖萬變不常總以表裏寒熱虛實六字盡之然六者之中又以以原文為有從意改虛實二字為最要蓋表裏寒熱無不皆有虛實既知表裏寒熱而復能以虛實二字決之則千病萬病可一以貫矣且治病之法無逾攻補用攻用補無逾虛實欲察虛實無逾脈息雖脈有二十四名主病各異然一脈能兼諸病而諸病之多不出於表裏寒熱蓋表裏寒熱悉出於脈之浮沉遲數然浮沉遲數之綱領惟在虛實虛實真則標本陰陽萬無一失倘脈有疑似又必兼證兼理以測其孰主孰客孰緩孰急能知本末先後即神之至也已六脈真辨脈法所言浮為表沉為裏遲為寒數為熱微細為虛弦強為實是故然矣然疑似中尤有真辨不可不察如浮雖屬表而凡陰虛血少中氣虧損脈必浮而無力是浮不可概言表沉雖屬裏而凡表邪初感寒束皮毛脈不能達脈必沉緊是沉不可概言裏遲雖為寒凡傷寒初退餘熱未清脈多遲滑是遲不可概言寒數雖為熱而真熱者未必數凡虛損之證陰陽俱困氣血張惶虛甚者數必甚是數不可概言熱虛與微細相類凡痛極氣閉營衛壅滯不通脈必伏匿是伏不可概言虛實與弦強相類而真陰胃氣大虧及陰陽關格等證脈必豁大而弦強是強不可概言實凡此六脈臨證者必反復推求庶無誤矣浮脈體狀浮脈為陽輕取有餘重按不足如撚蔥葉如水漂木洪大芤革皆統於此主病凡八證浮脈為中氣虛為陰不足為風為暑為脹滿為不食為表熱為喘急主治凡七條浮大為傷風其證惡風自汗面光頭身痛發熱鼻塞風傷太陽經也宜桂枝湯汗多不已外無表證玉屏風散浮緊為傷寒其證惡寒無汗面慘頭身痛腰脊強通體發熱寒傷太陽經也春秋九味羌活湯夏正柴胡飲冬麻黃湯若衰老虛弱而傷風傷寒難於用散輕以理陰煎重以大溫中飲浮滑為宿食其證口渴脹滯噯氣如敗卵亦作頭痛發熱但以身不痛脈不緊與傷寒異宜加味調中飲兼嘔和胃飲不嘔平胃散俱加神麯麥芽山楂楂原文為查蛋積加淡豆豉脹甚加枳實浮緩為濕滯其證惡濕體重面垢首如蒙物身足腫小便短衰老者胃苓湯治標腎氣丸治本少壯者廓清飲治標蒼朮丸治本浮芤為失血其證吐血衄血溺血便血如血在上而寸口洪滑血熱而逆也一陰煎治標六味丸治本血在下而尺脈洪滑血熱走而不守也保陰煎治標陰八味治本凡上下失血六脈浮細無力理陰煎去桂或五陰煎壽脾煎以調心脾左歸丸去龜膠以培真陰兼服瑞蓮丸以補脾土浮數為風熱其證目赤腫痛或膚癢發疹俱以八味逍遙散倍歸芍加荊防薄荷黃芩治標六味丸治本浮洪為狂躁其證欲狂不狂似呆非呆言語無倫坐臥不寧服蠻煎或二陰煎治標六味丸加紫河車末四兩菖蒲犀角遠志各二兩治本沉脈體狀沉脈為陰輕取不見重按乃得如石在水如鯉臥沙細小隱伏反關皆統於此主病凡十證沉脈為寒為水為氣為鬱為停飲為癥瘕為脹實為厥逆為洞泄為陽鬱之候主治凡六條沉細為少氣其證不思飲食或食不化或吐冷飲宜附子理中湯兼腰膝痛大營煎加減沉遲為痼冷其證厥冷精寒甚者唇青爪黑舌卷囊縮宜回陽飲或右歸飲沉滑為宿食壯者平胃散理氣丸弱者溫胃飲枳朮丸兼肩背痛手戰不能舉箸伏痰在脾也二陳湯治標茯苓丸治本沉伏為霍亂其證腹痛吐瀉或瀉而不吐或吐而不瀉壯者藿香正氣散弱者和胃飲手足冷理中湯或理陰煎俱加附子沉數為內熱其證便閉便血為淋為崩如下見血保陰煎上見火目赤咽痛抽薪飲胃火上衝厄逆不止安胃飲煩熱口渴牙痛失血玉女煎沉緊為心腹小腸痛心腹痛手拈散小腸痛暖肝煎兼寒熱頭痛五積散按沉雖屬裏倘暴病脈見沉緊而數又見頭身痛發熱乃寒邪初感陽為陰蔽即俗云寒包火也宜溫中發散慎勿施以涼劑致邪氣凝結遲脈體狀遲脈為陰象為不及往來遲慢一息三至緩澀代結皆統於此主病凡八證遲脈為寒為虛為噎膈為中滿為洞泄為帶濁為精不固為陰盛陽虧主治凡六條遲浮為裏氣虛其證必內寒不思食或嘔惡倦怠宜溫胃飲或理脾滌飲遲沉為表氣虛其證必惡寒面青肌冷宜十全大補湯遲在兩寸為氣不化精四君子湯兼上氣微滯有痰六君子湯遲在兩尺為精不化氣補陰益氣煎兼右歸丸加參遲而滑大主風痰頑痹四物合二陳加竹瀝薑汁使血行風自滅風滅痰自消矣遲而細小乃真陽虧弱為諸寒之證如寒在脾腎冷瀉冷痢胃關煎兼服九氣丹寒在脾胃食而不化脹滿吞酸嘔吐理脾滌飲寒在三陰足膝冷痛大營煎兼三氣飲浸酒飲之按脈來遲慢總由元氣不足不可用清涼攻擊惟以右歸丸大加人參為主數脈體狀數脈屬陽象為太過一息六至往來越度急疾緊促皆統於此主病凡七證數脈為寒熱為虛勞為癰瘍滑數洪數者多熱澀數細數者多寒暴數者多外邪久數者多虛損主治凡六條寒邪初感脈緊數當於浮脈主治第二條參四時虛實治之虛損之脈有數者有陰有陽陽虛者數而無力或兼細小其證必虛寒或外熱如火而內不喜冷飲大便亦無燥結此真寒假熱格陽證也右歸飲加澤瀉涼服以取納氣歸腎從陰引陽之義也又如口舌糜腐齦爛喉痹六脈細數鎮陰煎涼服亦同其義陰虛者數而弦滑其證必多煩熱或咳嗽失血或自汗盜汗或虛熱往來或眼昏耳聾如兼小水赤澀六味丸無赤澀左歸飲左歸丸兼服瑞蓮丸以補脾腎苟以數為熱而用知柏生地二冬必至脾泄而危矣瘧疾之脈有數者其證若止作俱數而兼弦滑此肝邪乘脾土有痰有食也平胃散合二陳湯倍加柴胡少加青皮草果檳榔或追瘧飲若止後不數不弦不滑牛膝煎或何人飲痢疾之脈有數者有寒有熱有虛有實若煩渴身熱小水短赤少腹脹痛而裏急後重年力強壯而形氣有餘其脈數而洪滑有力方為真實熱宜涼宜下先進百順丸次用痛痢飲隨進歸芍飲後服胃關煎如痢初起並日久不愈脈數而弦澀細弱慎勿攻之初起而少壯者佐關煎日久而衰老者胃關煎俱間服吳茱萸丸有脹滯而小水赤澀兼服胃苓湯癰瘍之脈有數者其證身不熱而惡寒飲食如常或身熱而得汗不解癰瘍之候也服仙方活命飲如高腫熱痛陽症也服濟陰湯敷抑陽散散漫而皮色不變痛亦不甚陰證也服回陽湯敷抑陰散似腫非腫半陰半陽症也服衝和湯敷陰陽散凡諸癰疽不問陰陽總以隔蒜多灸為上潰後服八珍十全胎孕之脈有數者乃衝任氣阻所以脈數本非火也當分強弱寒熱不得概指為火而以黃芩為聖藥如孕婦素虛本無所因而腰脹腹痛見血胎有不安此衝任失守胎元飲常服因多怒多思致肝脾多火多滯慣常墮胎兩關洪實固胎煎果因胎氣內熱脈見洪實胎不安者涼胎飲按數脈諸症凡邪盛者多數脈虛甚者尤多數脈則其是熱非熱從可知矣虛脈體狀虛脈舉按似有無力無神正氣虛也欲辨陰陽氣血須分遲數浮沉凡微濡遲澀皆統於此主病凡四證浮而無力為血虛沉而無力為氣虛遲而無力為陽虛數而無力為陰虛六脈無力為諸虛按至骨而無謂之無力實脈體狀實脈舉按皆弦鼓動有力邪氣實也欲明表裏寒熱須辨浮沉弦滑凡洪大緊促皆統於此主病凡七證浮大有力為發熱為癰毒沉實有力為脹滿為閉結為癥瘕洪滑有力為實熱火邪沉弦有力為痛滯寒邪按至骨而見謂之有力群方備載補陰益氣煎人參熟地山藥當歸陳皮升麻柴胡甘草生薑歸柴飲當歸柴胡炙草生薑一方有荊芥白芍一柴胡飲柴胡黃芩白芍生地陳皮甘草理陰煎熟地當歸炮薑肉桂炙草和胃飲陳皮厚朴炮薑炙草神香散丁香白蔻砂仁亦可等分為末薑湯下蘇子降氣湯蘇子半夏前胡厚朴橘紅當歸肉桂炙草薑引二陳湯陳皮半夏茯苓甘草薑棗引理中湯人參焦朮炮薑炙草貞元飲熟地當歸炙草金水六君煎當歸熟地陳皮半夏茯苓甘草生薑胡桃引金匱腎氣丸熟地棗皮淮山丹皮澤瀉桂附前仁牛膝茯苓右歸飲熟地淮山枸杞杜仲棗皮肉桂附子炙草右歸丸熟地淮山枸杞棗皮菟絲鹿膠杜歸桂附左歸飲熟地淮山枸杞棗皮茯苓甘草左歸飲熟地淮山枸杞棗皮菟絲龜膠鹿膠牛膝四六君子湯參朮苓草薑棗引加陳皮半夏名六君子湯十全大補湯參朮苓草地歸芎芍黃耆肉桂補中益氣湯人參黃耆焦朮當歸陳皮升麻柴胡炙草薑棗壽脾煎焦朮當歸淮山蓮米人參遠志炮薑棗仁炙草一陰煎生地熟地白芍麥冬丹參牛膝甘草六八味丸熟地棗皮淮芩丹澤加桂附名陽八味加知柏名陰八味八珍湯參朮芩草芎歸地芍大溫中飲熟地當歸人參焦朮柴胡麻黃桂薑炙草當歸六黃湯當歸黃耆生地熟地黃連黃芩黃柏獨歸酒當歸三兩泡酒加桂枝獨活乳沒香常服大營煎熟地當歸枸杞杜仲牛膝肉桂炙草五苓散豬苓茯苓澤瀉焦朮肉桂理脾條飲黃芩焦朮砂仁半夏白蔻炮薑加減一陰煎生地熟地白芍麥冬知母骨皮甘草大和中飲陳皮枳實砂仁厚朴南查麥芽澤瀉溫胃飲人參焦朮扁豆陳皮炮薑當歸甘草平胃散蒼朮厚朴陳皮甘草薑棗引枳朮丸焦術二兩枳實一兩荷葉包飯燒去荷葉為末舒肝飲炒芍當歸柴胡白芥萊蔔丹皮炒梔枳殼桂心元麥飲元參麥冬各三兩陽強不倒加肉桂大小陷胸湯大陷胸硝黃甘遂小陷胸半夏黃連瓜蔞大柴胡湯柴胡半夏黃芩赤芍枳實大黃薑棗引小柴胡湯柴胡半夏黃芩人參甘草薑棗引六湯香附蒼朮川芎炒梔神麯半夏聰明益氣湯黃耆人參焦朮當歸橘紅升柴防菖荊芥草桂枝湯桂枝白芍甘草生薑大棗玉屏風散焦朮黃耆防風桑葉引九味羌活湯羌防芎芷生地黃芩蒼朮細辛甘草薑棗引正柴胡飲柴胡防風陳皮白芍甘草生薑引麻黃湯麻黃杏仁桂枝甘草一方加薑蔥豆豉加味調中飲二朮枳朴陳皮神麯山楂草果黃連薑草胃芩湯焦朮茯苓豬苓澤瀉陳皮厚朴蒼朮肉桂甘草廓清飲枳殼厚朴腹毛白芥萊蔔茯苓澤瀉陳皮蒼朮丸茅蒼朮炒芍故紙厚朴茯苓小茴川椒炙草保陰煎二地白芍淮山黃芩黃柏續斷甘草五陰煎熟地淮山扁豆人參白芍焦朮茯苓五味炙草瑞蓮丸焦朮蓮米芡實淮山扁豆廣皮白蔻百合薑甘草逍遙丸焦朮柴胡當歸白芍茯苓炙草丹皮炒梔服蠻煎生地白芍麥冬茯神陳皮木通知母石斛丹皮菖蒲二陰煎生地麥冬元參木通黃連茯苓棗仁甘草回陽飲人參附片炮薑甘草理氣丸焦朮陳朴麥芽半夏檳曲枳實南星木香茯苓草茯苓丸茯苓半夏枳殼風化硝藿香正氣散藿香紫蘇桔梗苓夏朴陳焦朮腹毛芷草薑棗抽薪飲黃芩石斛木通炒梔黃柏枳殼澤瀉甘草安胃飲陳皮南查麥芽木通澤瀉黃芩石斛玉女煎石膏熟地麥冬知母牛膝手拈散元胡靈脂草果沒藥暖肝煎當歸枸杞茯苓小茴肉桂台烏沉香生薑五積散蒼朴薑桂麻黃陳皮枳殼芎芷參芍桔梗草歸夏胃關煎熟地淮山扁豆炮薑焦朮吳萸炙草九氣飲熟地薑附肉蔻吳萸補骨脂五味炙草三氣飲熟地當歸桂附芩芍枸杞杜仲細辛牛膝芷草鎮陰煎熟地牛膝肉桂附子澤瀉炙草嘔加薑虛加參追瘧飲首烏當歸柴胡青皮陳皮半夏甘草牛膝煎牛膝當歸陳皮酒泡一夕煎何人飲首烏人參當歸陳皮煨薑百順丸大黃一斤牙皂一兩六錢為丸如緑大痛痢飲歸尾白芍黃連枳殼木香萊服甘草歸芍飲白芍當歸萊蔔枳殼檳榔甘草佐關煎厚朴陳皮淮山扁豆豬苓澤瀉乾薑肉桂甘草吳茱萸丸吳萸焦朮肉桂炮薑神麯川椒仙方活命飲歸尾赤芍山甲銀花乳香沒香防芷粉貝皂剌草濟陰湯銀花連翹黃芩黃連炒梔丹皮白芍甘草抑陽散花粉薑黃白芷赤芍為末茶調敷抑陰散草烏南星赤芍白芷肉桂為末蔥酒調敷回陽湯參耆歸朮陳皮柴胡升麻附片炮薑炙草衝和湯參耆歸朮芎芷苓草乳香沒藥陳皮皂剌銀花陰陽散紫荊皮獨活赤芍白芷菖蒲為末蔥酒調敷胎元飲人參焦朮熟地當歸白芍杜仲陳皮炙草固胎煎當歸焦朮阿膠白芍黃芩砂仁陳皮涼胎飲當歸白芍石斛枳殼生地黃苓伏苓甘草余批景嶽景嶽一書每症引經義有論症論治述古辨古之詳而又斷以己見從不因人成事令人有所適從此醫中之名家猶詩中之李杜也近世不知公謂偏於溫補不知公殆長於溫補者也公更長於補陰以了千古未完公案蓋天地之道一陰一陽並行不悖者也乃方書所載補陽之方極多而補陰者自長沙地黃湯外別無良方亦千古大缺陷也景嶽制左右歸飲以補六味八味之不及制理陰煎以配理中湯制金水六君煎以配六君子湯制補陰益氣煎以配補中益氣湯又制一二陰等煎以治陰虛有火者於是陰陽配合而患陰虛一症者始有良方調治而無偏勝之虞此實千古大功臣也因書未經人批故特表而出之或問余曰景嶽重陰分丹溪亦重陰分景嶽之不足丹溪何也余曰景嶽之所重陰分者陰中之陽也故用藥溫溫主春夏生長之氣地黃枸杞當歸之屬是也即陰虛有火亦不過用甘涼甘平之品如生地麥冬酒芍之類是也丹溪之所重陰分者陰中之至陰也故用藥寒寒主秋冬肅殺之氣黃柏知母之屬是也此不可不辨古今醫道至景嶽始全何也天地間有陽即有陰二者原並行不悖古人著方多在陽分而陰分中之稱盡善者自長沙腎氣丸外方不多見亦千古遺憾況今人病陰虛者十居七八而其中之補陽者十居八九燥潤相反陰陽誤治如此殺人而人罔覺良可悲也自景嶽出誠有見於水為天一之源腎為先天之本精能化氣陰陽互根之理而治病製方多重陰分以補千古不及觀補陳一類可以見矣入門看病病人攢眉呻吟頭痛也坐而紐身腹痛也以手按心中腕痛也坐而身俯腰痛也護腹如懷卵物心痛也搖頭以手捫腮齒痛也坐而伏者短氣也籲歎者鬱結也言遲者風也行遲者痹也喉中漉漉有聲痰也問之不答聾也問之懶答或點頭中氣虛也鼻塞聲重傷風也口鼻氣粗外感也口鼻氣微內傷也又手摸心閉目不言心虛怔忡也不此之察猥云據脈定證真欺人之語也識者再三留意焉治病要訣邪之傷人先中於表漸入於裏病初在表須汗之散之使不傳經入裏則病易愈若表邪未盡而遽下之外邪乘虛而入或誤補之內邪壅閉不出變成壞症極多治病務分老幼強弱新病久病富貴貧苦幾等看法藥亦幾等用法經曰善治者先治皮毛次治肌膚其次治筋脈其次治六腑其次治五臟傷寒傷風辨傷寒無汗傷風有汗傷寒無涕傷風有涕傷寒脈緊傷風脈緩傷寒怕寒傷風怕風傷寒鬱而後熱傷風即能發熱傷寒手足微冷傷風手足皆溫又曰寒勝則痛風勝必腫舌辨陰陽水枯三證陰證舌黑為少陰中寒真陽遭其埋沒不能熏騰津液以致舌胎乾黑芒刺滿口法當驅陰救陽陽回則津回方用耆朮砂半薑附故紙肉桂其證必目瞑嗜臥聲低息短少氣懶言身重惡寒此辨陰症十六字訣陽證舌黑為陽明火旺爍乾津液以致舌胎乾黑芒刺滿口法當驅陽救陰陰回則津回方用白虎承氣諸法斟酌選用其證必張目不眠聲音響亮口臭氣粗身輕惡熱此辨陽症十六字訣陰陽證外有水枯一證不得其法無由分認舌胎灰黑間生芒刺動生津液常喜茶水飲之不多此為真水枯竭飲水自救法宜六味地黃湯或八仙長壽丸傷寒瘟疫受病不同辨傷寒受病由皮膚而得風寒外感自氣分傳入血分瘟疫受病由口鼻而入邪熱內伏自血分發出氣分一表一裏一寒一熱判若天壤傷寒瘟疫脈息不同辨傷寒初起左手脈盛於右手或浮而緊自是風寒外感必傳入三陰然後脈沉瘟疫初起右手脈盛於左手不浮不沉中按洪長滑數重者脈多沉伏細澀或一手先伏或六脈俱無此邪熱內壅閉塞脈道若認為陰脈誤用溫補禍不旋踵傷寒瘟疫病證不同辨傷寒初起其證但頭痛身痛發熱惡寒舌上未即有胎胸腹未即脹滿口舌未即乾燥四肢未即無力精神未即困憊氣未即臭面未即垢此表有病裏無病也瘟疫初起其證亦頭痛身痛壯熱惡寒舌上便有白胎胸腹便覺飽脹口舌便覺乾燥四肢便覺無力精神便覺困乏出氣便覺腐臭面上便有垢容此內熱怫鬱恰似風寒實非風寒也病重者往往六脈不見四肢盡冷此熱極似寒陽症似陰倘認為陰症誤用溫補下咽即斃蓋外面雖屬純陰然細察之或舌胎黃燥或胎黃而黑或舌生芒刺或胸滿腹脹或大小便不通或氣噴如火或鼻如煙煤或大便膠固或挾熱下痢或熱結旁流或蓄血出斑或唇焦口燥或舌卷囊縮或口鼻出血或大便下血或潮熱作渴或發狂譫語或遍身起疙瘩或四肢腫痛或揚手擲足或筋惕肉瞤或頭面俱腫或咽喉腫痛或煩躁不安或不省人事或大渴飲冷以上等症是熱極危極之候見一二端即宜大下疊下稍緩不救傷寒瘟疫治法不同辨傷寒初起只宜解表不可攻裏若驟用芩連梔柏大黃等藥則風寒閉塞反入裏矣入裏之後亦宜分別寒熱虛實治之不可誤下必至大便祕結六脈沉實舌胎黃燥痞滿燥實悉具方可下之所謂傷寒下不嫌遲也瘟疫初起只宜清裏不可散表若誤用麻黃桂枝細辛白芷川芎羌活獨活及一切發散等藥則精血愈枯邪熱愈熾往往害人治法輕者清之用神解清化三黃之類重則下之用升降涼膈雙解六一順氣之類下後裏證猶存以承氣養榮湯再下之裏證既去以清燥養榮湯調理之其有下後病愈二三日前證復發者仍照前法治之不必疑懼總之瘟病從無陰證治法病初以解毒散結清熱導滯為主病後以生血養陰為主始終不可用發散溫補開胃健脾之藥陰陽表裏辨陽症之表發熱惡寒頭痛腰脊強便清不渴手足溫和陽症之裏唇焦舌燥煩渴掀衣揚手擲足大便祕結小便赤澀爪甲紅活脈浮洪數身輕易於轉側陰症之表無熱惡寒面慘息冷手足微厥陰症之裏不渴踡臥引衣自蓋唇紫舌卷大便滑泄小便清白爪甲青黑脈沉細身重難以轉側惟腹痛與嘔吐陰陽表裏皆有之內傷外感辨傷於飲食勞役七情六欲為內傷傷於風寒暑濕為外感內傷發熱時熱時止外感發熱熱甚不休內傷惡寒得暖即解外感惡寒烈火不除內傷惡風不畏大風反畏隙風外感惡風無風先畏見風更甚內傷頭痛乍痛乍止外感頭痛連痛不休內傷有濕或不作渴或心火乘肺亦作燥渴外感二三日表熱傳裏口方作渴內傷則熱傷氣四肢沉困無力倦怠好睡外感則風傷筋寒傷骨一身筋骨疼痛內傷則呼吸氣短外感則喘促氣盛內傷手心熱外感手背熱內傷懶言惡食口尚知味二便如常外感鼻塞流涕口不知味小便黃赤內傷屬不足宜溫宜補宜和外感屬有餘宜汗宜吐宜下若內傷誤作外感妄發其表損傷元氣禍在反掌理中十全主之如內傷外感兼症氣虛者補中湯加發散藥血虛者四物湯加發散藥陰虛者理陰煎加麻黃柴胡陽虛者理中湯加麻黃柴胡此法活人甚多看病歌訣有病先從氣色看面色光澤病易痊赤紅如潮血虛極實火唇紅並口乾口唇白者陽分弱鼻孔紅燥肺火炎耳疼腎熱或君火心熱舌紅又燥煩肝肺有熱現於面左肝右肺見兩顴面色青黑肝腎損白主氣虛宜培元色若黃滯脾有積眼下青色定主痰鼻青腹痛病主死目赤面青命難全陽虛腹痛按即止按之轉甚食火痰臍腹疼痛少陰證小腹疼痛厥陰寒再看舌胎分表裏紅黃有火清即安白滑裏寒溫中急白澀裏熱黃滑寒火之深者黃多燥胭脂舌向陰虛探若是白胎小便赤疫熱在裏飲達原舌黑原來分數種仔細觀察要心虔火極似水生芒刺誤服熱藥喪黃泉水極似火氣息冷回陽救急妙如仙腎氣虛極舌胎黑滋陰潤燥莫遲延精液枯極舌燥黑回陽八味妙通玄瘟疫舌黑皮自脫先下後清自然安惟有傷寒不易治分辨陰陽要的端陽證心煩身惡熱陰證聲低體畏寒陽證氣粗兼口臭陰證蜷臥並懶言陽證面紅思飲水陰證面青閉目眠七日以前若誤下轉成漏底病難痊傷風發熱身有汗壯熱無汗是傷寒不思飲食定傷食脾虛健脾自安然喜飲冷水知有火好飲熱湯是有寒陽虛自汗氣不足陰虛盜汗不歸元血虛五心多內熱氣虛時常體畏寒陰氣衝陽耳鳴閉陽氣限陰腹鳴弦口苦膽虛並心熱肝經有熱口常酸脾熱口甘胃熱淡肺熱口辛腎熱鹹腰痛宜分寒與濕腰酸房勞不待言色欲頭昏腰膝軟氣虛頭暈神不全風腫皮膚多淋閉氣腫時消又時旋食積腫來肚腹痛血腫皮膚赤脈纏陽水腫兮小便澀陰水脾腎兩虛看上腫下消宜發汗下腫上消貴培元手陷起遲知水腫手陷隨起氣使然朝寬暮腫血虧損暮寬朝腫氣虛傳脫肛不痛氣血弱脫肛腫痛風火連晝瘧表邪兼補氣夜瘧補血並疏肝化痰消積更利水虛者補之始能痊痰熱流走瘡瘍見痰寒凝結在胸前寒勝則痛火勝腫風麻濕木氣滯悁病也氣鬱結者胸脅痛濕鬱周身痛不安痰鬱氣喘多脅痛血鬱四肢無力焉肝氣痞塞胸脅脹脾氣不升頭昏眩中風脈浮手足暖中氣脈沉手足寒腹滿時痛為不足腹滿有餘痛纏綿痛在瀉前為實積痛在瀉後是虛元咽痛紅腫三陽熱咽痛不渴三陰寒病係假寒清內熱病係假熱溫真元胎前宜涼疏兼補産後溫補逐瘀先真陰將亡小便絶真陽將脫面紅鮮陰證脫兮眸子暗陽證脫者見鬼牽初病實熱苦寒用病後虛熱宜甘寒實而誤補猶堪解虛而誤攻命難延如此望聞問的當方才切脈細心研看婦女歌女子二七天癸至調經察脈要分明先期而行為血熱後期而至是寒經經來疼痛為氣滯行後而痛氣虛真其色黑者多實熱淡白為虛或痰凝煙塵黃水血不足紫色原屬風邪侵行經之時宜慎重若有憂鬱血必停走於腰膝多疼痛散在四肢則不仁停於血海生寒熱逆上衝心患戰兢兩手尺脈皆沉伏此病分明是閉經肝大肺小應有子兩尺不斷滑方真心腎俱旺知是孕肺大肝小孕不成左寸滑實為男脈右尺沉滑女現形肝肺俱浮胸膈痛兩關沉緊腹中疼看小兒歌小兒有病令人憐全仗醫生仔細觀令人抱出光明處先將面部用心看額屬心兮頦屬腎左肝右肺兩腮前鼻乃脾經為主宰五經辨色要心虔白者氣虛黃有積赤者為熱青主寒鼻塞聲重傷風重眼下青色主飲痰口唇赤白陰陽判赤者胃熱白者寒蟲積唇內生白點疳音中醫指小兒的腸胃病氣鼻燥體態乾有痛啼哭總不止有積繈褓不耐煩抱出貪涼欲赴冷此乃內熱使之然若是當風即畏縮必是傷風與陰寒鼻冷瘡疹耳冷熱遍身發熱是風寒手足心熱口發渴紋沉食積是真詮若是下午手心熱陰虛盜汗夜生煩倘若手指稍頭冷便是驚風一例看只有中間一指熱小兒一定是傷寒中指微微獨自冷定然麻痘恐相纏復看指紋記歌訣浮沉色氣審的端要看指紋風氣命三關內推細心研三關寅卯辰部位病之吉凶在此間初起風關病無礙氣關紋現恐纏綿乍臨命位誠危急射甲通關命難全指紋何故浮然樣邪在皮膚病易蠲音除去驅出去掉忽而關紋沉沉狀已知入裏病盤旋身安脈紋紅黃色紫脈為熱紅傷寒青主驚風白疳疾三關見黑命恐難傷食彎外青兼紫脈紋彎內是風寒腹痛紋入掌中裏色淡氣弱稟先天關紋滯澀皆因積邪遏陰營衛氣連食鬱中焦風熱熾不行推蕩病何遷復診掌後關中脈浮沉遲數審的端七至八至為數熱四至五至為遲寒浮脈主表病在外沉脈主裏病內潛數脈六至腑有熱遲脈三至主臟寒浮而有力風與熱無力氣需宜培元沉而有力痰食積沉而無力氣滯間遲而有力痛難禁遲而無力是虛寒數而有力本實熱無力瘡瘍恐熬煎若要分別陰陽證氣息冷熱用手探口中氣熱小便赤舌黑必燥下為先氣微便清手足冷參耆桂附妙如仙再看胸腹堅與軟虛實此中可細參脾胃本虛中氣弱四君六君選用焉此是兒科真妙訣神而明之世稱賢陳飛霞云小兒指教但以浮沉分表裏紅紫辨寒熱淡滯定虛實用之不盡矣分類用藥歌補氣箭耆與人參黨參洋參北條參雲苓焦術淮山藥炙草桂圓白茯神下氣杏仁鐵鏽漿鬱金蘇子甲沉香前胡葶藶枇杷葉萊蔔瓜蔞枳實良順氣青皮陳橘皮藿香效與木香齊香圓香附和烏藥柿蒂砂仁白蔻宜冷氣疼痛要肉桂吳萸薑附胡椒配小茴丁香炒砂仁元胡靈脂陽氣退破氣檳榔紫厚朴三稜苦薤蓬莪朮薑黃萊蔔花青皮枳實寬胸同枳殼補血生熟二地黃當歸白芍首烏良一味丹參兼四物河車不用又何妨涼血丹皮地骨皮丹參生地地榆宜龜膠鱉甲焦荊芥犀角青篙赤芍奇止血蒲黃茜草根茅根三七發灰靈阿膠側柏灶心土焦芥當歸藕節莖破血桃仁歸尾加澤蘭蘇木紅藍花薑黃莪朮鬱金子赤芍丹皮乾漆渣暖胃丁香與藿香良薑草蔻炮煨薑砂仁白蔻兼紅蔻蓽撥胡椒效最強調脾開胃用參苓焦術炮薑半夏陳白蔻砂仁甘草炙藿香堪與木香倫虛咳補肺款冬花五味阿膠紫苑加懷藥參芩和炙草天冬薏苡蜜升麻實咳瀉肺用黃岑葶藶桑皮桔梗勻枳殼杏仁花粉配天冬貝母馬兜鈴諸般咳嗽西防風半夏陳皮天麥冬蘇葉茯苓金沸草杏仁貝母膽星同肺實喘急款冬花兜鈴蘇子杏仁加肺虛喘急當補氣腎虛金匱或陽八消痰半夏膽南星枳殼呆仁疑為杏仁塊茯苓貝母瓜蔞金沸草陳皮白芥枯黃芩退諸火熱用黃芩心熱黃連燈竹心肝熱柴胡並白芍脾熱明粉同熟軍肺熱天冬桑皮效腎熱黃柏知母臨膽熱竹茹龍膽草胃熱石膏花粉均大腸槐花通大海小腸木通車前仁膀胱滑石同萹蓄三焦有熱梔子尊熱重羚羊犀角屑火結硝黃效如神虛熱元參天麥冬女貞知母骨皮同粉丹石斛懷生地苓朮參耆任變通骨蒸勞熱用青蒿生地骨皮鱉甲燒知母丹皮黃柏炒胡連更比銀柴高發汗麻黃並紫蘇浮萍淡豉薄荷俱升麻白芷霜蒼朮荊芥葛根蔥白須收汗黃耆酸棗仁桂枝白芍麻黃根烏梅牡蠣冬桑葉浮麥山萸合四君消食山查油厚朴麥芽香附六神麯青皮萊蔔花檳榔枳實寬胸勝枳殼寬中枳殼與陳皮蒼朮腹毛厚朴宜桔梗擯榔萊蔔子木香香附奏功奇膨脹擯榔厚朴宜冬瓜皮合茯苓皮腹毛枳實牽牛子蘿蔔頭和香附施止渴葛根與麥冬石膏花粉烏梅宗梨漿五味兼蚊蛤犀角飴糖竹葉同解鬱川芎與鬱金腹毛蒼朮炒梔仁台烏芍藥和香附神麯擯榔合二陳大便不通用大黃朴硝巴豆杏仁霜油歸生地蓯蓉肉松子麻仁鬱李強小便不通赤茯苓豬苓澤瀉車前仁木通滑石同瞿麥葶藶石葦竹葉心病屬氣虛徵下陷補中益氣最為靈不通若是真寒閉火藥煎湯效更神浮腫不消用木瓜豬苓澤瀉與芫花木通大戟同商陸薏苡牽牛信不差嘔吐合香並二陳丁香白蔻縮砂仁生薑草蔻延胡索胃熱岑連梔子勻止泄車前參朮苓豬苓澤瀉縮砂仁建蓮肉蔻淮山藥訶子烏梅粟殼神疾痢黃連廣木香槐花歸芍地榆良桃仁萊蔔青皮草枳殼檳榔薤子強瘧疾常山草果仁檳榔蒼朮及威靈柴胡乾葛焦知母厚朴青皮合二陳辟瘟草果花檳榔蒼朮雄黃及大黃蘇葉枯芩油厚朴藿香香附降真香頭痛川芎白芷辛天麻藁本菊花均辛夷蒼耳蔓荊子見證尤宜分六經頭風眩痛明天麻獨活細辛旋覆花白菊蘇荷荊竹瀝辛夷萆薢效無差腹痛元胡白芍強小茴蒼朮高良薑梔仁草蔻吳萸子香附沉香廣木香心痛良薑及黑薑元胡肉桂橘皮湯靈指指疑為脂沒藥焦梔子香附檀香廣木香腰痛兔絲熟地黃寄生續斷小茴香胡桃杜仲川牛膝故紙蘆巴肉桂良膝痛苡仁並木瓜靈仙牛膝緑升麻加皮杜仲漢防己故紙羌防續斷加喉痛射干山豆根連翹大力廣元參薄荷荊芥芩連等甘桔僵蠶燈竹心目痛羌防歸芍芎黃芩梔子菊花同柴胡荊芥穀精草木賊蒺藜白木通身體風痛海風藤防風荊芥與威靈秦芄羌獨延胡索狗脊桐皮桑寄生齒痛石膏北細辛蒺藜生地與黃芩骨皮梔子丹皮等碎補荊防並穀精耳聾全蠍石菖蒲木通碎補乳香扶氣虛耳聾當補氣腎虛滋水是良圖去風荊芥西防風蒼耳天麻烏藥同白菊薄荷羌獨活僵蠶全蠍正川芎蒺藜蟬退蔓荊子藁本蘚皮白芷充去寒宜用理中湯白朮人參炙草薑更有吳萸真肉桂細辛附子蜜麻黃去濕秦艽薏苡仁木瓜蒼朮西茵陳天麻白朮漢防己草薢菖蒲塊茯苓五臟補瀉涼散補心龍眼當歸柏子仁瀉心燈草車前竹葉心涼心黃連犀角川貝母散心半夏香薷菖蒲根補肝荔枝雞肉酸棗皮瀉肝連翹白蘞龍膽奇涼肝生地側柏赤芍藥散肝蒼耳木賊並蒺藜補脾炙草西砂蔻白朮瀉脾山查鬱李及神麯涼脾紫貝蘚皮薏苡仁散脾松脂排草橘紅朴補肺官燕飴糖與參耆瀉肺石葦苦杏生桑皮涼肺生地紫菀野菊花散肺麻黃蔥白紫蘚宜補腎鹿茸枸杞巴戟天瀉腎枸杞秋石並食鹽涼腎丹皮骨皮與黃柏散腎附子細辛極妙焉六經引藥太陽引經麻黃羌陽明芷葛升膏勷古同襄音輔助的意思少陽芎柴青皮等太陰升麻葛芍蒼少陰知獨細辛桂厥陰芎青柴萸良用藥如用兵古人云不為良相當為良醫此何以説蓋良醫保命治病無異於良相保王克賊間當論之國家無事內安外寧如人天君泰然百體從令元氣充實外患不侵倘元氣稍虧急宜培補如嗣主暗説文曰閉門也引申為愚昧糊塗之義弱宜輔弼多賢倉廩空虛宜儲財節用務使君明臣良民殷國富始無境內之憂也設不幸而滿夷竊發擾亂邊疆如人偶為風寒外侵一汗可愈使純用補藥收斂是謂關門逐賊賊必深入夫賊既深入為良相者必先薦賢保主然後興兵討賊如善醫者必先審胃氣然後用藥攻邪更不幸而兵圍城下糧絶君危惟有保主出奔再圖恢復如人元氣將脫且緩治病而急保命命存而病可徐圖也蓋行軍以糧食為先用藥以胃氣為本軍無糧食必困藥非胃氣不行庸醫不先固本一意攻邪何異薑伯約九伐中原糧食不繼出師未捷而昏主饞臣反納降於鄧艾可借鑒焉大將討賊內顧雖已無憂而用兵尤貴知法如人氣血未虧卻病不難不善醫者雜亂用藥自相矛盾反壞胃而引賊何異趙括將兵漫無紀律反折兵而喪國乎良醫用藥必如諸葛將兵運籌帷幄決勝千里心有主宰而不惑兵有紀律而不亂陳有變化而不拘相天時察地理乘機勢大軍對壘奇兵埋伏進可討賊退可自守雖三軍之士性情不同而我駕馭有法同心克敵則一也雖然敵難克矣國家元氣必因此而耗傷城池關隘或因此而崩圯為良相者安我人民實我倉庫固我封疆所必然也如人病後不服補藥營衛其何以固元氣其何以復乎至於內傷諸症不過三陰虧損本無外邪入寇善醫者如伊尹相太甲但使之處仁遷義救弊扶偏調變陰陽而已矣何用霸功徵伐以擾我境內耶若食積痰火蟲瘀癰疽諸實症又如國有大姦急宜剪除不可純用王道之劑姑息以養姦也試觀元首股肱君臣同歌一體忠言良藥救正信有同途良相之以道事君何異良醫之以藥療病良醫之以切脈審症何異良相之區畫籌謀良相之陳善辟邪何異良醫之延年卻病故岐伯相黃帝即推此意以作靈樞觀仲景傷寒用藥如講兵法他如兵法云知己知彼百戰百勝兵不在多貴於善用皆與醫道無二理也籲上醫醫國良相知醫用藥如用兵古人先我而言矣保命如保主庸醫不能識也誠能引申觸類舉一反三則於醫道豈復有餘蘊哉醫學集成卷一跋發端統論上古之世人心醇厚世俗敦龐人俱壽享百餘由無靡麗紛華搖奪三寶所以元氣流行而無夭劄之患逮至末世人心不古世風日下善氣閉塞惡氣充盈聚為刀兵散為疫癘刀兵也而加以凶荒疫癘也而繼以水火人竟漠然不知也上天本好生之德神聖開方便之門而忍群生受此災厄耶抑生民自造之孽有令造物無權者也當今之世孝弟忠信不講禮儀廉恥全無讀書者不端品行力田者不顧子孫以機巧為聰明以刻薄為才智恃勢胡為妄自尊大安能挽頽風而延壽考倘若存心改過善無不為而更能寡嗜欲以保精滅言語以保氣少思慮以保神自見精神強健何患不壽享期頤至若風雨不時偶染疾病選擇諸方臚臚音本意為皮肚腹的意思此處為陳述的意思列於後果能按經施治對證立方其活人濟世無涯矣謹此再跋
