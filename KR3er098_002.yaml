body:
  text: 醫學集成卷二傷寒清臣曰傷寒係屬大證治法多端最難分辨冬月為正傷寒四時為感冒人有虛實中有淺深風傷氣分寒傷血分傷風有汗傷寒無汗氣虛宜扶陽出表血虛宜養陰出表守定六經無論合病並病見病立方對證用藥隨手可愈太陽經證脈浮緊頭痛項強腰脊背痛發熱惡寒有汗為風傷衛法主桂枝湯以驅衛分之風桂枝白芍甘草生薑大棗無汗為寒傷營法主麻黃湯以發營分之寒麻黃桂枝杏仁甘草風寒二方氣虛加參朮血虛加歸地陽虛加薑附頭身痛發熱惡寒無汗煩躁為風寒兩傷營衛法主大青龍湯營衛互治風寒並驅麻黃桂枝杏仁石膏甘草生薑大棗有汗去麻黃不煩躁去石膏太陽腑證口渴溺閉有蓄尿蓄熱蓄血癃閉四證蓄尿五苓散焦朮茯苓豬苓澤瀉肉桂蓄熱去桂加滑石蓄血加生地歸尾紅花小薊萬年霜癃閉則月窄脹異常愈下利脹愈加法主白蔻宣暢胸膈砂仁半夏醒脾開胃肉桂化氣桔梗開提生薑升散如壺蓋吃緊揭起則出之意使上焦得通中樞得運而後膀胱之氣一轉運而尿自出也陽明經證脈浮洪前額眼眶脹痛鼻築流清涕口乾不眠發熱不惡寒法主葛根湯以解陽明之表葛根升麻白芍甘草或柴葛解肌湯柴胡葛根羌活白芷赤芍黃芩石膏桔梗甘草薑棗無太陽證去羌活無少陽證去柴胡無汗惡寒去黃芩加麻黃下利減石膏嘔吐加半夏口燥心煩汗出惡熱渴欲飲冷熱邪漸入陽明之裏法主白虎湯以撤其熱石膏知母甘草粳米陽明腑證便閉譫語口臭氣粗身輕惡熱熱邪已歸陽明之腑法主小承氣湯微蕩其實略開其閉大黃枳實厚朴胃實腹滿微發譫語法主調胃承氣湯以蕩其實而去其滿大黃芒硝甘草舌胎乾燥噴熱如火痞滿堅實狂譫無倫法主大承氣湯急驅其陽以求其陰大黃芒硝枳實厚朴少陽經證脈浮弦頭痛在側耳聾脅痛寒熱往來法主小柴胡湯以解少陽之表柴胡半夏人參甘草生薑大棗如先寒後熱為陽不足加桂枝乾薑先熱後寒為陰不足加當歸白芍少陽腑證口苦目眩咽乾法主黃芩以瀉少陽裏熱兼陽明發熱口渴清涼飲生地白芍黃芩柴胡花粉石膏石斛知母甘草痞滿去生地加枳實太陰寒證脈沉遲吐食腹滿時痛自利不渴法主理中湯人參焦朮炮薑炙草加半夏砂仁腹滿去朮加附子或理脾滌飲黃耆焦朮半夏砂仁白蔻炮薑太陰熱證脈沉實咽乾腹滿痛便結燥渴法主桂枝大黃湯桂枝赤芍大黃枳實檳榔柴胡甘草生薑或大承氣湯少陰寒證脈沉細背寒踡臥咽痛腹痛肢冷下利法主附子湯附子人參焦朮茯苓白芍或附子溫經湯黃耆焦朮半夏砂仁炮薑故紙益智倍附子少陰熱證脈沉數心煩口燥咽乾咽痛燥渴便結法主六一順氣湯枳實厚朴芒硝大黃柴胡黃芩白芍甘草或大小承氣湯厥陰寒證脈沉細肌冷甲青舌短胎滑小腹滿痛法主六味回陽飲人參附子熟地當歸炮薑炙草或舒氏方黃耆焦朮半夏砂仁炮薑附子吳萸花椒厥陰熱證脈沉弦舌卷囊縮煩躁厥逆消渴便硬法主六一順氣湯或大承氣湯凡病不外六經以六經之法合而治之無不立應一經見證即用一經之法經證腑證兼見即當表裏兩解若太陽與陽明合病桂枝湯中加葛根陽明與少陽合病葛根湯中加柴胡如三陽並病羌葛柴並用三陽與三陰表裏同病是為兩感表裏皆熱九味羌活湯去蒼朮加柴葛硝黃表裏皆寒大溫中飲加附子凡治諸病總以正病為主兼證為佐引經為使乃為上乘灸傷寒穴道太陽證灸風府陽明證灸內庭少陽證灸臨泣太陰證灸隱白少陰證灸太溪厥陰證灸中封過經不解灸期門餘熱不盡灸曲池三里合谷風門行間身熱足冷灸大都腹痛灸委中瘟疫清臣曰瘟疫與傷寒判別天淵傷寒宜辛溫發散瘟疫宜清涼攻下傷寒邪從皮毛而入中於肌膚瘟疫邪從口鼻而入伏於膜原瘟疫世不常有要街衢市鎮裏巷鄉村沿門傳染方為瘟疫今人指傷寒熱病春日溫病為瘟疫誤人不少千古治法惟吳又可戴麟郊深知其義學者宜詳察焉瘟疫初起先寒後熱熱後不寒舌胎純白邪在膜原也達原飲檳榔厚朴知母黃芩白芍草果甘草竹心車前腰背項痛邪溢太陽也加羌活眉稜骨痛邪溢陽明也加葛根寒熱口苦邪溢少陽也加柴胡汗出不徹而熱不退白虎湯虛渴加人參斑出不透而熱不退舉斑湯當歸炒芍白芷柴胡升麻甲珠生薑汗斑並行而熱不除白虎合舉斑湯胸膈痞滿嘔渴頻煩舌胎黃色邪傳裏之上部也萊蔔子淡豆豉生梔仁頻服取吐燥結便閉舌胎純黑或生芒刺邪傳裏之中下部也大承氣湯痞滿便不結小承氣湯不痞滿只便結調胃承氣湯表裏證悉去熱仍不退膜原之邪未盡也三消飲即達原飲加羌葛柴大黃經絡之氣為熱所鬱必致發黃茵陳蒿湯茵陳梔子大黃生薑熱邪乾於血分必致蓄血桃仁承氣湯當下失下厄逆不止大承氣湯加桃仁歸尾赤芍當下失下循衣摸床捉空理線元氣將脫也黃龍湯人參熟地當歸枳實厚朴芒硝大黃下後邪氣復聚承氣養榮湯生地當歸白芍知母枳實厚朴大黃下後無汗發熱人參白虎湯下後自汗盜汗發熱柴胡湯柴胡黃芩葛根陳皮甘草薑棗下後熱不除柴胡清燥湯柴胡黃芩花粉知母陳皮甘草薑棗下後神虛譫語清燥養榮湯生地當歸白芍知母花粉陳皮甘草硃砂衝燈心下後奪氣不語人參養榮湯人參當歸熟地白芍知母陳皮麥冬五味甘草下後虛痞參附養榮湯生地當歸白芍人參附子生薑病愈復發脈虛證虛安神養血湯熟地當歸炒芍茯神陳皮棗仁遠志桔梗甘草桂元附應下諸證舌黃舌乾舌卷舌短舌黑舌生芒刺鼻如煙煤胸腹滿脹脈厥體厥揚手擲足譫語發狂煩燥昏沉厄逆補遺瘟疫雜證大頭瘟頭面浮腫普濟消毒飲黃芩黃連元參藍根馬勃陳皮柴胡桔梗大力連翹薑似應為僵蠶薄荷升麻甘草氣虛加人參便實加大黃發頤瘟耳前後腫荊防敗毒散加大力外二味拔毒散明雄白礬研末茶調敷撚頸瘟喉痹失音頸大腹脹蝦蟆音瘟腹不脹均用荊防敗毒散加大力外三妙散明雄白礬火燒原文為稍研吹瓜瓤瘟胸高脅起嘔血如汁生犀散犀角黃連花粉人中黃蒼朮陳壁土氣虛加人參便閉加大黃楊梅瘟遍身紫塊忽發黴瘡三黃湯生地赤芍元參大黃人中黃黃連丹皮滑石甘草渴加石膏葛根疙瘩瘟發塊如瘤遍身走痛人中黃散人中黃雄黃硃砂研末桔梗薄荷甘草煎湯下便閉加大黃葡萄瘟青紫斑點狀若葡萄羚羊散羚羊角生地元參麥冬黃芩知母銀花薑蠶大力羌活防風甘草竹葉錦霞瘟渾身斑疹痛癢非常犀角飲犀角大力赤芍生地荊芥防風渴加石膏粉葛扣頸瘟痰火迷心袖繩欲縊香附鬱金雄黃為丸以開膻中之鬱再加二陳以祛膈中之痰更加羌活細辛鬼箭羽丹參赤小豆通心瀉火自愈軟腳瘟溺清泄白足腫難移白虎湯加蒼朮以上扣頸瘟軟腳瘟外皆風寒包火凝聚三陽使經絡不通激成赤腫宜外風散寒內清邪熱通用敗毒散加減毒盛加硃砂以瀉君火重加人中黃以瀉臟熱赤腫甚者針去惡血此專言瘟疫熱證也斑疹清臣曰傷寒斑疹由於失表瘟疫斑疹由於失下傷寒出斑最險瘟疫出斑亦危色紅者吉色黑者凶發在周身者輕發在心窩者重出肌膚間如花瓣不刺手為斑出肌膚外如粟粒刺手為疹有陰毒陽毒之分陽毒宜舉宜化陰毒宜溫宜散凡出斑疹邪在經而不在胃治以正病為主斑疹為輔脈洪手足溫斑點紅赤且大為陽斑脈微手足冷斑點淡紅且隱為陰斑陽斑犀角地黃湯加升麻紫草或黃連解毒湯加犀角元參升麻甘草或消斑湯元參麥冬各一兩丹皮五錢升麻白芷各二錢白芥沙參各二錢陰斑陽虛附子理中湯陰虛附子理陰煎陰陽並虛大溫中飲感冒清臣曰冒風感寒有傷風傷寒兼火兼食血虛氣虛陰虛陽虛之別按病立方隨手奏效感冒有汗為傷風加味桂枝湯桂枝羌活防風白芍甘草薑棗氣虛加沙參感冒無汗為傷寒加減麻黃湯麻黃羌活防風紫蘇甘草薑蔥血虛加生地感冒兼火衝和靈實飲生地川芎羌活防風葛根白芷柴胡黃芩石膏薄荷甘草薑棗感冒兼食行氣香蘇散香附紫蘇陳皮川芎麻黃羌活烏藥枳殼甘草薑蔥有汗去麻黃加桂枝因濕加蒼朮食重加山查神麯感冒屬血虛四物合小柴胡湯加桂枝感冒屬氣虛補中湯加羌防白芷感冒屬氣血兩虛八珍湯去焦術加黃耆酒炒羌活防風桂枝感冒屬陰虛理陰煎加麻絨柴胡感冒屬陽虛理中湯加麻絨柴胡感冒屬陰陽兩虛大溫中飲瘧疾清臣曰瘧疾有四曰風曰寒曰痰曰食因風寒痰食客於半表半裏陰陽相搏為寒為熱而瘧疾成治法無汗務使出汗有汗務要收汗有風者消風有寒者散寒有痰食者化痰消食表邪重者先解表裏邪重者先解裏熱多宜涼寒多宜溫久瘧宜補不可純用攻伐風瘧熱多寒少有汗桂枝湯加羌防半夏或小柴胡倍人參加桂枝白芍寒瘧寒多熱少無汗麻黃湯加羌防半夏生薑或附子理陰煎加柴胡麻黃痰瘧寒熱並增痰涎湧盛小柴胡加枯礬白芥或理脾滌飲加葶藶白芥食瘧寒熱相伴痞滿惡食小柴胡加蒼朴萊蔔青皮草果或清脾飲焦朮茯苓半夏青皮柴胡黃芩厚朴草果甘草紅米生薑瘟瘧先熱後寒加減桂枝湯桂枝白芍石膏知母甘草粳米或生地首烏黃芩柴胡二母滑石甘草疸瘧單熱不寒加減白虎湯生地石膏麥冬知母貝母黃芩柴胡甘草竹心車前或首烏當歸沙參陳皮柴胡知母貝母石膏甘草竹心牝瘧單寒不熱加味麻桂飲熟地當歸麻黃肉桂陳皮炙草燒薑或桂附理中湯加苓夏瘧夾瘟疫加減達原飲檳榔厚朴草果知母黃芩柴胡蒼朮陳皮半夏茯苓麥芽炙草生薑便閉加大黃間日三日夜發四物合小柴胡加升麻或生地當歸川芎黃柏知母升麻甜酒一日二三發附子理中湯或六君子湯並加升柴脾虛久瘧補中湯倍人參加苓夏煨薑或六君子加草果烏梅腎虛久瘧八味丸加首烏鱉甲或右歸丸加首烏鱉甲瘧入三陰久瘧不止附子理中加砂半草果或經驗方黃耆焦朮茯苓當歸首烏玉竹附子炮薑草果炙草薑棗元氣大虛久瘧不止十全大補湯加鱉甲或濟川飲條參北耆焦朮熟地當歸棗仁附子肉桂燒薑桂元瘧疾三方第一方陳皮半夏茯苓靈仙蒼朮厚朴黃芩柴胡青皮檳榔炙草生薑井水河水煎頭痛加白芷一方加烏梅茵陳第二方首烏生鱉甲知母焦朮當歸靈仙柴胡黃芩陳皮茯苓炙草生薑甜酒井水河水煎第三方人參焦朮黃耆當歸陳皮柴胡升麻炙草薑棗熱加首烏知母寒加附子炮薑截瘧宋西橋方新筆調朱砂於餅上寫天火燒太陰地火燒太陽五雷靈不滅燒斷諸不祥重寫三次後録病人姓名預前食自止袁子才方勃瘧勃瘧四山之神使我來縛六丁使者五道將軍收汝精氣攝汝神魂速去速去免逢此人發時朗誦不斷即止神應瘧疾丸白砒一兩緑豆子四兩研末糊丸緑豆大明雄水飛為衣壯者五丸小兒三丸預前冷水下忌熱物半日即止沙糖飲白糖四兩燒酒半斤臨發時燙滾儘量調飲加紅米研末尤效灸瘧疾穴道大椎三椎間使命門噫嘻至陰太溪脾俞又病人仰臥草量兩乳平中折斷從乳比至下頭盡處是穴男左女右灸三壯痢疾清臣曰痢有四端一曰陷邪一曰時毒一曰秋燥一曰滑脫初起多屬濕熱曆久多屬虛寒行血則便膿自止調氣則後重自除赤傷血分白傷氣分赤白並行氣血兩傷屋漏塵腐險危宜慎陷邪者六經之邪陷入而為痢也宜分經用藥病在三陽人參敗毒散加芩葛硝黃病在三陰砂半理中湯加附子吳萸時毒者厲疫流行人觸之而為痢也宜寬腸下滯大承氣湯加歸芍芩連桔梗或濟川飲當歸白芍檳榔