在皮裏膜外宜薑汁竹瀝斬諸痰法無論在經在臟及各飲證斬關丸制硫磺五兩生白朮生附子肉桂半夏白蔻吳萸花椒雞內金各一兩研末丸服附五飲證留飲胸膈不開飲食無味復兼咳嗽理脾滌飲水飲由胃而下走腸間瀝瀝有聲微痛作泄前方加桂附支飲由胃而上入胸膈咳逆倚息短氣不得臥前方加故紙益智更用斬關丸見上以下痰而愈懸飲由胃而旁流入脅咳引刺痛前方加芫花草果搜出脅縫之痰自愈溢飲由胃而溢出四肢痹軟酸痛前方加虎骨靈仙在手加薑黃在足加附子凡痰涎水濕在胸背腰項手足筋骨牽引鉤痛走移無定手足痹冷氣脈不通此乃痰涎在胸膈上下實者控涎丹甘遂大戟白芥等分研末為丸梧子大每薑湯下五丸七丸十一丸虛者理脾滌飲加枯礬二錢吐血清臣曰吐血一證宜降氣不宜提氣宜行血不宜止血行血則血歸經絡止血則血停胸膈積久必吐此證有陰虛有陽虛有氣虛脾虛及格陽等證總之虛宜補寒宜溫瘀宜行滑宜澀熱宜涼受陽藥者易治受陰藥者難愈有三藥必用童便荷葉沉香有兩藥必禁知母黃柏曆久總宜補脾脾旺則健運有權不求止而自止矣陰虛吐血芍藥湯白芍六錢鬱金三錢降真香花蕊石炙草各二錢側柏葉炒陽虛吐血理脾滌飲加故紙益智降香花蕊石氣虛吐血六君子湯加黃耆當歸沉香花蕊石脾虛吐血歸脾湯去木香加沉香虛勞吐血引血湯黃耆一兩六錢當歸七錢焦芥五錢丹皮側柏薑灰各二錢人參一錢炙草二錢房勞吐血六味丸加杜仲枸杞牛膝勞嗽吐血救肺飲當歸白芍黃耆人參冬花百合紫苑兜鈴鬱金麥冬五味炙草格陽吐血八仙長壽丸加肉桂火旺吐血生地四物加芩連丹皮大黃藕節燈心傷暑吐血加味玉泉散石膏一兩青蒿五錢香薷四錢扁豆三錢甘草二錢側柏炒荷葉傷酒吐血清化飲見噎膈怒傷吐血化肝煎白芍貝母青皮陳皮丹皮炒梔鬱金香附澤瀉努力跌打吐血加味芎歸飲當歸川芎桃仁紅花鬱金大黃醋炒甜酒童便大吐不止生地一兩軍灰即大黃五錢童便衝久吐不止側柏葉湯側柏葉向西炒炮薑各五錢艾絨炒三錢馬屎炒八分補遺脈數宜清補二地白芍阿膠麥冬丹皮降香牛膝甘草荷葉脈遲宜溫補黃耆焦朮半夏砂仁炮薑沉香花蕊石脈實宜攻下當歸赤芍桃仁紅花蘇木元胡降香大黃咳嗽吐血出於肺二冬貝母紫苑桑皮蘇子桔梗甘草痰涎帶血出於脾丹梔歸脾湯因驚吐血出於心四物去芎加丹參茯神麥冬甘草因怒吐血出於肝生地當歸赤芍青皮丹皮柴胡炒梔沉香甘草房勞吐血出於腎救勞丹熟地枸杞杜仲人參鹿膠牛膝邪熱嘔血出於胃生地白芍丹皮犀角元明粉甘草楊西山失血大法統用白芍五錢甘草二錢湯陰虛加生地丹皮童便陽虛加焦朮棗仁童便炒炮薑氣虛加黃耆焦朮茯神外感加防風焦芥薄荷火盛加丹皮黃芩犀角格陽合鎮陰煎傷暑加香薷扁豆黃連跌打加桃仁紅花山漆怒傷加鬱金香附竹茹氣逆加降香沉香枇杷葉血枯加龜膠鹿膠阿膠乾咳加熟地天冬麥冬不止加茅根側柏童便肢冷氣喘加人參飛羅面雞子清和調滾藥沖服吐血有癆蟲驗癆蟲法乳香燒煙薰病人手背男左女右以紬帕蓋手心良久有毛從掌中出白者易治紅黑者難治無毛即無蟲治癆蟲法雄精硃砂硫磺各一錢麝香一分研末大麯酒和勻午日午時或天醫日用獨蒜去蒂蘸藥從尾脊骨挨次擦上腫痛處即蟲所在此處多擦其蟲自滅又八月初一日一早收百草頭上露水點膏肓穴穴在背上四節骨左右旁三寸神妙灸癆蟲法濕紙貼背脊上紙先乾處即蟲所在以黑點記用艾火隔蒜多灸蟲出鐵鉗入火內恐飛入人口須預防之又癸亥日亥時灸兩腰各七壯或九壯十一壯不用蒜隔蟲出即捉火內可免復傳先勿令病人知傳尸癆宜救癆殺蟲丹鱉甲酒醋炙熟地山藥沙參骨皮各一斤山茱萸八兩茯苓白薇白芥各五兩人參二兩白鱔魚一尾二三斤余皆可將白鱔煮熟搗爛烘乾和前藥為丸每夜五更時洗臉北面仰天念北斗咒七遍開水送丸五錢服過七日自有奇效服至半單其蟲盡化每日務燒降香置床下北斗咒祭神祭神害我生人吾奉帝敕服藥保身急急如律令北斗符敕附圖北斗符敕黃紙一張硃砂淨水新筆書符時誠心念咒語火化開水沖服灸吐血穴道膻中乳根中腕氣海關元肺俞心俞肝俞腎俞脾俞胃俞膈俞膏肓鼻衄清臣曰血從鼻出多由肺不收藏但有實火虛火之分實火宜清虛火宜溫若概以為實火而單用芩連犀角未有能奏效者也實火飲冷惡熱黃連解毒湯加竹心車前或犀角地黃湯加芩連麥冬虛火飲熱惡冷收血湯二地當歸黃耆各一兩焦芥炮薑側柏炒山漆各三錢或益火丹人參焦朮熟地當歸炮薑附子澤瀉牛膝炙草上熱下寒格陽衄血鎮陰煎或八味丸加牛膝五味久衄不止茅花湯生地當歸白芍木通辛夷焦芥茅花服後仰臥立止或梔仁白芷煅存性研末吹鼻立止止鼻衄歌石榴花瓣可以塞蘿葡藕汁可以滴火煅龍骨可以吹水煎茅根可以吃鼻衄單方大蒜搗貼足心冷水洗足冷水拍後頸窩濕帕貼頂門四方均效灸鼻衄穴道心俞膈俞少澤湧泉風門外關合谷囟囟音會便血清臣曰先糞後血腹中不痛為腸風先血後糞肛門腫痛為臟毒其證有熱有寒有氣虛不攝總之風宜散毒宜解熱宜涼寒宜溫虛宜補知此數法治無遺蘊矣腸風下血血鮮而清初起防風山藥秦艽焦芥黃芩槐角茜草黃連甘草日久防風生耆山藥秦艽焦芥槐角茜草黃連升麻烏梅甘草臟毒下血血黯而濁初起生地生耆山藥防風秦艽茜草陳皮升麻黃連甘草日久人參生耆白芍山藥當歸防風茜草升麻陳皮黃連甘草便血因火芍藥湯白芍生地黃芩丹皮甘草或生地白芍元參麥冬槐花地榆木耳甘草便血因寒附子理中湯加歸芍或補中湯加薑附便血原文此處無血根據前後文應有此字久不止氣血大虛歸脾湯或十全大補湯統用三地湯生地熟地當歸各一兩地榆三錢木耳五錢或生新湯當歸生地地榆山漆各三錢人參二錢炙便血穴道中腕氣海關元命門三里溺血清臣曰血原不出膀胱今從小便出係心肝火盛遣熱於膀胱使陰血妄行治法心熱宜清肝熱宜泄不可輕用止澀之藥恐瘀血積於陰莖令人痛楚難當小便不痛為溺血四物湯加牛膝或七正散赤苓木通前仁炒梔扁蓄膽草甘草稍燈竹心心熱溺血阿膠散阿膠生地當歸丹皮麥冬炒梔發灰或導赤散加黃連肝熱溺血龍膽瀉肝湯見口證或清肝散白芍炒梔丹皮黃連木通滑石甘草車前證屬虛證溺久不止脾虛補中湯加續斷發灰腎虛六味丸加牛膝前仁灸溺血穴道腰俞腎俞脾俞膈俞三焦俞列缺章門大敦附各血證齒縫出血為腎火沸騰名牙宣證六味丸加碎補無火加桂附目中出血為肝經火盛生地四物湯加龍膽草耳中出血為心腎熱熾填竅止氛湯熟地二兩麥冬一兩菖蒲一錢舌上出血係腎水不交心火太盛護舌丹熟地元參麥冬丹皮桔梗黃連肉桂人參五味甘草臍中出血因大小腸火盛兩止湯熟地兩半棗皮麥冬各五錢五味焦術各二錢半皮毛出血由肺腎火盛兩益湯熟地二兩人參麥冬各一兩山漆三錢九竅出血為血熱妄行當歸補血湯黃耆二兩當歸一兩生地焦術各五錢人參焦荊芥各三錢
