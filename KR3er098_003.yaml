去毛蘇木紅花各一錢丁香五分麝香一分研末黃酒調服八厘一加童便制艾絨法陳皮去筋梗烈日曬脆放篩上揉絨去淨渣合麝香川烏草牙皂細辛火硝明雄研極細常帶身邊得熱氣為妙附諸骨卡喉法面東持水一碗右手劍訣書符於碗內口中念咒隨書隨念七遍畢用劍訣在碗中點三點令患者將水一氣吞下其效如神符式龍兒奉化神符敕令咒云吞骨散化骨丹化龍下海入深灘即吞即化無論銅鐵比化開吾奉太上老君急急如律令煉水法每日晨起淨心沐手焚香向東持水如前法七次畢自將碗內之水一氣吞完如此四十九日不可間斷以後用之如神做皮蛋方鴨蛋一百個用杠炭灰一百兩石灰三十兩青鹽三十兩柏枝葉大香各二兩花椒陳茶葉各一兩後四味煎水調包蛋上壇盛三月光亮極美可售又方鴨蛋百個鹵水二湯碗炭灰三升石灰升半食鹽二茶杯調米湯用火鉗夾蛋杵糊蛋上即放草灰內俟乾收入壇中過五十日可食
