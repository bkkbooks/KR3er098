body:
  text: 醫學集成卷三頭痛清臣曰頭痛一證有三陽有三陰有風寒風熱內熱痰厥氣虛血虛腎虛頭風等證宜分經用藥對證立方不得以川芎白芷藁本蔓荊胡亂瞎撞太陽頭痛連後腦有汗桂枝羌活防風川芎白芍甘草無汗麻黃羌活防風川芎蔓荊甘草陽明頭痛在前額表證葛根湯見傷寒加芎芷裏證白虎湯加硝黃少陽頭痛在兩側小柴胡湯加川芎薄荷或小柴胡湯加芎芍苓太陰濕痰壅塞胸膈頭痛蒼白二陳湯加南星或砂半理中湯少陰中寒阻截真陽頭痛附子理陰煎加麻黃細辛或大溫中飲加附子厥陰頭痛在腦頂濟川飲焦術四錢附子藁本花椒各三錢吳萸肉桂各一錢或桂枝湯加參附吳萸花椒飴糖六經頭痛九味羌活湯倍川芎太陽證倍羌活加藁本陽明證倍白芷加葛根石膏少陽證加柴胡太陰證兼腹痛身重倍蒼朮少陰證兼足冷氣逆倍細辛減黃芩加麻黃附子厥陰證兼嘔涎厥冷加吳萸有火倍黃芩加石膏有痰加半夏頭風加菊花風寒頭痛羌活防風川芎白芷蔓荊藁本薄荷細辛甘草或蔓荊防風羌活荊芥川芎白芷細辛薑蔥有火去芷辛薑加膏芩風熱頭痛菊花散菊花旋覆羌活防風蔓荊石膏枳殼甘草或清空膏羌活防風柴胡黃芩黃連川芎細辛炙草內熱頭痛茶調散川芎白芷荊芥黃芩石膏薄荷茶葉生薑便閉加大黃或白虎湯加生地麥冬木通澤瀉痰厥頭痛二陳湯加天麻川芎黃芩花粉白芥或蒼白二陳湯加天麻蔓荊偏左為血虛小柴胡湯加歸芎羌防或半解湯白芍一兩川芎五錢當歸三錢柴胡二錢半夏蔓荊甘草各一錢一加荊芥薄荷偏右為氣虛補中湯加芩芷獨活蔓荊或六君加黃耆川芎蔓荊左右俱痛為氣血兩虛補中去歸朮加蒼朮川芎蔓荊細辛木香或十全大補湯兼腰酸痛為腎虛水虛六味丸火虛八味丸偏正頭風睛珠欲裂羌活防風荊芥白芷川芎菊花僵蠶蟬脫薄荷細辛甘草薑蔥茶葉目腫加赤芍蒺藜外硫磺一錢花椒三分研末作丸左痛塞右耳右痛塞左耳雷頭風痛耳如雷鳴清震湯蒼朮升麻各四錢荷葉一大張一加陳皮蔓荊荊芥薄荷甘草或尤氏方連翹大力黃芩炒梔荊芥犀角薄荷桔梗甘草風火上攻頭頂極痛舒氏方生地八錢當歸五錢黃芩黃連柴胡膽草各二錢或解熱湯生地當歸黃芩黃連元參麥冬柴胡荊芥風熱並痰眉棱骨痛選奇湯羌活防風黃芩半夏甘草或二陳加羌防薄荷真正頭痛朝發夕死補中湯加川芎蔓荊附子間服八味丸灸百會穴三壯灸頭痛穴道百會風池後頂列缺合谷神庭眩暈清臣曰眼花為眩頭旋為暈或火或痰或血虛氣虛或陰虛陽虛或脾腎虛或肝腎虛務須分辨明白治乃無誤火盛丹梔逍遙散或芩連二陳湯俱加枳殼菊花天麻痰盛蒼白二陳湯加南星天麻或二陳加芎星旋覆天麻竹瀝血虛四物加橘半天麻或四物加人參天麻氣虛六君加枳實天麻或補中加川芎天麻陰虛火盛一陰煎或加減一陰煎俱加川芎天麻陽虛寒盛參附湯加炮薑天麻或附子理中湯加天麻脾腎兩虛朝補中湯夕六味丸俱加天麻肝腎兩虛理陰煎加橘半棗皮枸杞天麻或大補元煎加天麻通用防眩湯熟地當歸白芍焦術各一兩川芎棗皮半夏各五錢人參三錢天麻一錢陳皮五分或清暈化痰湯陳皮半夏茯苓川芎白芷羌活防風枳實南星黃芩天麻二味酒炒細辛生薑火盛加黃連炒梔痰盛加薑汁竹瀝血虛去羌防星芷加歸地氣虛去羌防白芷加參朮灸眩暈穴道百會上星風池囟會肩背痛清臣曰肩背痛證由手太陽氣鬱不行須詳辨病之所因主治方有準則豫閲歷多年由虛損而得者居其大半治法又宜重劑培補時時作痛氣滯也香附陳皮川芎防風二活蔓荊藁本木香甘草時痛時止氣虛也補中湯加芎防二活夜甚時止血虛也四物去芍加二活防風蔓荊藁本甘草夜痛不止血瘀也薑黃靈脂紅花川芎二活防風蔓荊藁本甘草痛則肩背強風也靈仙二活防風蔓荊川芎藁本甘草痛則肩背重濕也二朮二活防風蔓荊藁本甘草痛則嘔吐眩暈痰也蒼朮二陳湯加赤芍川芎香附薑黃枳殼桔梗炒梔海桐皮生薑曆久不止氣血大虛也十全大補湯灸肩背痛穴道曲池肩井風門肩顒音臂痛清臣曰臂痛一證由風寒濕三者為病或坐當隙風或睡後失蓋或坐臥濕地及乳婦以手枕兒皆令臂痛治法雖各有方不如多灸為妙風邪勝其痛流走桂枝湯加歸芎羌防香附附子靈仙桑枝甜酒寒邪勝其痛甚苦五積散加桑枝甜酒濕邪勝其痛重著解濕丹二朮二苓二活防風靈仙桑枝甜酒因血虛四物用二芍加黃耆薑黃羌活桂枝甘草因氣虛補中湯加薑黃靈仙桂枝桑枝因氣血虛十全去苓桂加羌防附子桂枝桑枝灸臂痛穴道肩井肩髃膏盲胃痛清臣曰此證男子少而女子多由氣量窄狹凡事不能自主每成斯疾方書謂有九種無論寒火蟲食治法總兼行氣至有真心痛者旦發夕死用藥尤在所當急遊走無定為氣痛調氣飲香附鬱金沉香元胡砂仁荔核廣香或排氣飲寒加薑桂熱加梔芍喜冷惡熱為火痛石室丹白芍一兩生地五錢當歸炒梔各三錢枳殼陳皮各二錢甘草一錢或白芍四錢甘草二錢湯加梔連香附枳殼橘葉夏枯草喜熱惡冷為寒痛嵩崖方良薑官桂半夏砂仁貫仲甘草或神保丸廣香胡椒各二錢半全蠍七個巴豆十粒去油研末為丸朱砂為衣每柿蒂湯下三分噯腐吞酸為食痛藿砂平胃散加曲麥草寇或焦查三錢陳皮半夏神麯各錢半麥芽兩錢枳實厚朴各一錢生薑吐沫流涎為痰痛二陳加白蔻廣香一加蒼朮草蔻白芥或偏治湯白芍焦術各三錢當歸茯苓柴胡半夏各二錢白芥甘草各一錢痛不移處為死血桃紅四物加丹皮枳殼元胡甚者加酒軍或化瘀丹歸尾赤芍香附元胡蘇木紅花酒軍澤蘭甜酒脹滿拒按為實痛撼積丹檳榔枳實醜牛大黃各三錢牙皂二片研末酒下或化滯煎檳榔大黃枳實厚朴廣香甘草心悸喜按為虛痛補中湯加苓夏吳萸或異功散加吳萸木香面白吐涎為蟲痛理中湯去草加烏梅花椒或二陳去草加檳榔史君楝根補遺手足冷為火孫氏方白芍貫仲各三錢黃連炒梔乳香各二錢甘草五分或黃連一錢菖蒲三分手足溫為寒祕籙丹當歸一兩白芍五錢蒼朮肉桂各二錢良薑一錢或神香散寒熱均不效白芍五錢甘草一錢湯加附子黃連各一錢或黃連六錢附子一錢薑棗真心痛火證救真湯白芍一兩炒梔三錢廣香二錢菖蒲炙草各一錢寒證豬心湯麻黃肉桂附子炮薑用豬心煎水燉服灸胃痛穴道脾俞胃俞腎俞巨闕間使足三里足大拇指甲男左女右三壯上脘中腕脅痛清臣曰脅痛係肝病當分外感內傷但外感少而內傷多宜各隨所因調治又曰肝氣宜順不宜逆故脅痛必須平肝平肝必須補腎腎水足斯肝木有養其氣自平而痛自止傷寒小柴胡湯加苓芍青皮牡蠣食積和胃飲加曲麥枳實青皮木香怒傷平肝散白芍川芎丹皮青皮柴胡枳殼薄荷甘草瘀血桃仁承氣湯加歸芎青皮柴胡鱉甲痰氣和脅飲蒼朮青皮香附半夏白芥薑黃枳殼甘草鬱結逍遙散加川芎陳皮鬱金香附勞傷補中湯加白芍青皮房勞歸芍六味丸加柴胡青皮虛損肝腎兼資湯白芍一兩當歸熟地各五錢棗皮二錢半青皮三錢甘草錢半火加炒梔一錢痰加白芥一錢補遺左脅痛左金丸黃連薑汁炒六錢吳萸鹽炒一錢或枳芎散枳殼川芎鬱金各三錢甘草一錢右脅痛枳橘散枳殼橘紅薑黃各三錢甘草一錢或推氣散枳殼薑黃各三錢肉桂三分炙草一錢生薑一加橘半虛氣脅痛人參一兩熟地二兩肉桂三錢附子一錢柴胡五分甘草三分或焦術一兩人參五錢當歸白芍各三錢肉桂二錢柴胡甘草各五分以上諸方左加枳殼右加鬱金灸脅痛穴道膈俞內關竅陰支溝再以草橫度兩乳平中折斷從乳斜趨痛脅下草盡處灸卅壯章門邱墟腰痛清臣曰腰痛一證有風寒有風濕有痰積有氣滯有瘀血有腎虛證雖不同無不歸本於肝腎主治之法以養血固精為綱領自無不應手奏功腰冷如冰風寒也六合散當歸杜仲羌活獨活大茴小茴有汗加桂枝無汗加麻黃或五積散加杜仲吳萸腰重身痛風濕也獨活寄生湯獨活桑寄生續斷可代當歸茯苓秦艽防風狗脊靈仙牛膝肉桂細辛甘草或二朮茯苓杜仲續斷秦艽防風羌活牛膝炙草腰軟如綿痰積也蒼白二陳湯加南星白芥或六君加香附杜仲枳殼南星回圈痛脹氣滯也順氣湯當歸杜仲香附沉香茴香元胡肉桂生薑或吳萸附子細辛湯加香附小茴杜仲枳殼痛如錐刺跌打瘀血也桃紅四物加元胡肉桂乳香沒藥牛膝炒軍甜酒或二地當歸丹參杜仲牛膝續斷碎補乳香沒藥血竭自然銅年久亦效腳膝酸軟腎虛也水虛左歸飲火虛右歸飲俱加杜仲故紙胡桃或燒腰散杜仲故紙青鹽等分入豬腰或羊腰內燒食灸腰痛穴道腰俞腎俞昆侖命門腹痛清臣曰痛證宜分氣血食蟲寒熱虛實氣痛無定血痛有定食痛脹甚蟲痛饑甚虛者喜按實者拒按寒則凝滯熱則絞急且腹屬三陰臍上屬太陰當臍屬少陰臍下屬厥陰看明部位斯無遺誤諺云通則不痛痛則不通二語是治腹痛要著至痧症腹痛酌用溫補臍上痛平胃散加香砂枳曲或砂半理中加木香當臍痛附子理陰煎去當歸加小茴或加味真武湯焦朮茯苓白芍小茴附子肉桂炮薑甘草薑棗臍下痛六味回陽飲加吳萸花椒或吳萸四逆湯吳萸附子炮薑炙草加花椒乍痛乍止為火清肝散白芍一兩炒梔八錢黃連枳殼各三錢甘草二錢或抑火丹香附陳皮白芍炒梔黃連枳殼木香滑石甘草痛無增減為寒桂附六君加薑萸或溫中飲人參當歸各三錢炮薑二錢肉桂木香炙草各一錢便後痛減為食香砂平胃散加查麥曲或大和中飲加香附木香面白唇紅為蟲二陳去草加史君烏梅或六君去草加雷丸棐子痛不移處為死血散血丹香附一兩元胡三錢桃仁紅花各二錢炒軍一錢澤蘭五錢甜酒或滌瘀湯山查三錢蘇木二錢桃仁陳皮各錢半歸尾紅花各一錢澤蘭四錢甜酒拒按為實平胃散加枳實大黃或白芍五錢甘草二錢湯加枳實大黃乳香喜按為虛異功散加黃耆木香或補中湯加香附木香補遺痞塊腹痛枳朮丸加馬屎用黃土炒焦煎服氣結腹痛馬通散馬屎二沱燒存性開水泡澄清服中寒腹痛吳萸附子細辛湯加小茴三陰諸氣腹痛神保丸見胃痛柿蒂燒薑湯下膀胱腎氣脅下痛小茴煎酒下灸腹痛穴道神闕氣海水分巨闕太白膈俞脾俞胃俞內關中腕筋骨痛清臣曰肝主筋腎主骨肝腎虧損外邪乘虛而入故筋骨痛治宜補肝益腎兼祛外邪風痛桂枝湯加歸地二活防風甜酒寒痛麻黃附子細辛湯加歸地杜仲牛膝肉桂濕痛當歸散當歸一兩蒼朮加皮靈仙牛膝各五錢秦艽陳皮良薑香附各三錢甘草一錢泡酒服虛痛立效散熟地當歸各五錢枸杞四錢故紙鹿茸木通各三錢茯苓二錢研末酒丸服補遺逐寒丹熟地八錢當歸五錢桂枝三錢麻黃加皮靈仙川烏續斷牛膝各二錢炙草一錢甜酒八珍去苓加羌防靈仙續斷八仙酒焦術四兩加皮三兩生地當歸首烏杜仲續斷虎脛骨各兩半泡酒服獨歸酒當歸四兩獨活桂枝各一兩乳香沒藥各五錢泡酒服鐵鏡方二活加皮靈仙秦艽防風桂枝前胡牛膝泡酒服神通飲淮木通去皮二兩河水煎睡時熱飲厚被取汗風痛加羌防各二錢寒痛加麻桂各二錢濕痛加防已三錢炙筋骨痛穴道承山肝俞昆侖臨泣霍亂清臣曰霍亂者心腹猝痛揮霍撩亂也即攪腸痧證由感惡毒厲氣使陰陽不和經絡不通上吐下泄或不吐不泄或吐而不泄或泄而不吐或渴欲飲冷或渴欲飲熱或兩腳轉筋俗呼為麻腳證治此之法總以調氣行血開鬱為