body:
  text: 敘天地有好生之德人生天地間不能體天地之心為心縱有千駟萬鍾歷數十春秋只與草本同朽烏足道哉烏足道哉吾邑清臣先生隱君子也聰明特出倜儻不羈文字皆工而詩賦猶勝昔從宿學宋西橋先生游賞以大器期之赴童軍前茅輒列因患足疾遂不復向名場角逐一室詠歌著有醉吟詩草西橋先生見而悅之曰汝臣此不死矣詩才若此可付棗黎以公同好詩板落成復於閒居研究軒岐書無不讀數十年來活人甚眾且先生以精明之質抱瀟灑之懷儒學而為醫學一時縉紳先生咸耳其名如中丞嚴渭春方伯吳廉生明府陳薌墀輩常與公游談醫理講文理外拈賦詩唱和為尤多焉蓋由先生才思敏捷學問宏通故諸公不但以名醫目之兼以名士稱之也晚年善病閉戶著書採取各家精華及生平素所應驗手錄成篇欲傳後世用心誠苦而救世良殷矣癸酉秋闈後余錦裏歸來先生出書見示余捧讀再三竊見首卷提絜大綱次三臚陳雜證四卷附載醫案穴道及百誤八法切而不泛簡而不繁誠後學津梁入門路徑也夫神農以後著書立說不下數十百人然其中短長互見先生棄其短取其長掇百家之長纂成斯集溫涼攻補不執一偏按證選方足供實用古云太上立德其次立功其次立言先生此書誠立言而樹功德於無窮者也余有心斯道恨未窺一斑恒親炙光儀更端請教先生口講指畫層出不窮知其底蘊深也書成命序爰綴俚言以為之首時同治十三年歲官甲戌清和既望香圃駱世馨撰自敘同治癸酉廉年七秩追思少壯不堪回首幼奉先君命學詩文詞賦延師課讀負笈從游多歷年所道光丙申先君辭世抱歉多端於是博覽搜奇無不學習道光壬寅陡患腳疾寸步難移延醫調治浪費多金足不能動手不能舉項強筋痛骨瘦如柴病經五載醫過百餘九死一生幸留殘喘因而採買藥書遍查腳疾見古書所立之方與醫家所用之藥舒筋除濕一一用盡終屬不效予從字樣之從足者搜尋忽於痿躄門中覓出五痿症來遵法調理始服麗參銀花以解前藥繼服補中以益正氣手足頭項俱能動搖服十全大補去芎苓加附片枸杞巴戟鹿茸數劑而安改劑為丸萬病俱失行走如常嗚呼醫道之廢弛久矣從此重開藥肆普集藥書細心考究約計十年始行問世曆遍朱門茅屋臨症頗多見病亦廣大小沉屙隨治即效然終不免為他人作嫁衣裳爾因退處田間課子教孫甫經兩載適有邑侯陳公薌墀來守雙邑幕友吳又香患失血多醫罔效疊次來請不得已而往焉初見陳公禮賢下士有儒者風言談起居隆禮相待又香病癒往來甚密呤詠唱和前後八載已足生平之幸而薌翁不沒人長每於謁大府會同僚遍為延譽由此渭春中丞廉生方伯及督藩臬道各州府縣無不備至隨處所作病論所立藥方所解藥性甚多陳薌墀勸刻於前吳貫槎勸刻於後皆各贈匾額予終不敢刻何也予不安於小道誠恐異日九泉難見雙親於地下不以詩文詞賦傳而以小道傳不獨貽笑方家其辜負親心也實甚邇年來門人欲梓奈力瘁神疲難為編輯幸同邑儘先訓導季君馥垣熟於靈柩精於法律協同胞弟仕鵬起而憐之謂數十年功苦豈忍一旦付之於是力為較正令三子永鐘抄寫一載始成並將大小銅人針灸齊付梨棗以公同好知我有人罪我有人予亦不稍為計及也已清臣自記凡例是編之集由博反約由晦而顯使業醫者開卷了然斯無亥豕魯魚之誤是編普集名家精粹去繁就簡易於翻閱隨時考究洞若觀火以免搜索之難業醫務從傷寒入手辯明十二經絡每一經中皆有陰陽無論在經在腑一寒一熱一表一裏辨之不明臨症必誤業醫務從大家入手先講六經法律後明藥性寒熱若徒讀斷簡殘編抄本小說髫年學習皓首模糊以先入者為主也法律訂自前人運用在乎自己學者要有靈機救人全憑活法若膠柱鼓瑟萬難奏效古人立方原有君臣佐使配合無多效如桴鼓或靜中有動動中有靜或陰中求陽陽中求陰必再三審慎切勿雜湊成方本草所載藥品三千常用不過三百當於二三百中考究五味五色辯明寒熱溫平更必詳究真偽斯運用乃見如神藥品無論貴賤總以有精汁有氣味者為佳切莫好奇喜開別名至藥肆不知胡亂稱揀誤人性命藥之靈應不在貴賤方之靈應不在多寡藥求真實方求對症若用希奇難買之藥富者擔延時日貧者束手待斃矣名家各有所長有長於溫補長於攻下長於清涼長於和解長於扶陽長於養陰長於補先天長於培後天長於女科長於小兒吾盡摘其長而錄之醫理之說深者見深淺者見淺自長沙後醫書疊出各執一見欲求全手幾無其人學力富者少臨症臨症多者無學力少臨症者仗恃學力妄撥前人多臨症者胸無實據捕風捉影可知紙上空談與糊亂瞎撞二而一者也是編每論一病即載一方或載數方其美不勝收者付之補遺以便觀覽隨載針灸穴道以為外治之一助至穴道必看銅人圖方知每一病名標出綱領使人知其大概雖未究本窮源道其巔末亦可為學者立標準作指南耳內經云得其要者一言而備不得其要流散無窮一言可備者陰陽兩字也病之千頭萬緒不外五臟六腑而臟腑諸症不外陰陽後世妄立名色舌有三十六喉症七十二疽有二十四諸如此類難以枚舉況此三者亦只分陰陽而已古人療疾以望聞問切為要後世舍去三者僅以切脈為重浪費筆墨從浮沉遲數外畫蛇添足一病分幾十脈一脈分數十症亂人心目何不於望字添幾十望聞問添數十聞問耶總之內經以平人脈為準則察其有餘不足再從四大脈探討斯得之矣五臟六腑平和無病今人自尋疾病壯年喜服參茸桂附及一切強筋壯陽之品不知補一臟即損數臟及至暮年無藥可服精氣神為人身至寶得之則存失之則危根本一失百病叢生兼之嗜酒玩煙恃情縱欲何能益壽比之於燈油盡燈滅方之於魚水涸魚困欲求長生者須以飯食為大良方獨宿為延年妙品富貴之病難治一經染患日更數醫一清二表三攻四補任意胡為以至輕者重而重者危矣貧苦之病易愈延醫難取藥更難說病抓藥不日愈也雖不儘然大半如此醫生療疾務要品正行端不可在此說彼孀婦閨閣更宜謹慎於診脈後論脈論症係屬何病主用何藥法本何人症即險危從容告之切勿乘人危險妄取人財以致聲名敗壞病家延醫務要實心恭敬未看病時說病原由不可令其猜病東坡云吾求愈病而已豈以困醫為哉不知醫為爾所困爾之身更為醫所困矣延醫者其知之病家取藥莫惜銀錢務求上池靈品若圖便宜七折八扣虧人工本藥定難言賣者射利買者損錢而病者含冤受困矣開藥鋪之家務采上品藥材遵古炮製情願使人說我藥貴莫使人說我藥假此中造無限功德以假作真誤人性命生人易欺冥法難逭音逃避人生有形之病可治無形之疾難療如風寒暑濕六欲七情瘡痍癬疥皆有形之疾醫能施治無形之疾如不端品行不顧聲名奸詐機謀心術盡壞釀成怪病此無形之疾醫不能治書云自作孽不可活人須悔過遷善百中可救二三否則遺及後人立見消亡較傳屍癆為更毒針灸之術肇自岐伯詳於靈柩針灸諸病功成反掌但神功妙術自漢失傳精於穴道者恒不數覯音遇見余常感慨久矣道光戊申忽於楊子堅處得銅人圖四幅與醫宗金鑒針灸大成無異細心研究三十餘年凡遇疾病施治即效予特表而出之為司命者指一準則云
