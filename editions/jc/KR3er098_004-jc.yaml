有當況其他乎醫家誤藥不稱重病藥輕輕反重輕重不均皆誤人此道微乎危亦甚藥雖對症而輕重之間與病不相稱猶難驟效醫家誤藥過劑療寒未已熱又至療熱未已寒更生觀君舉筆須留意藥雖與病相稱而用之過當則仍不稱矣可見醫貴三折肱也醫家誤失標本緩急得宜方是穩先病為本後為標纖悉幾微要中肯病症錯亂當分標本相其緩急而施治法醫家誤舍正路治病不識求其屬壯水益火究根源太僕之言須誦讀王太僕云熱之不熱是無火也寒之不寒是無水也無水者壯水之主以鎮陽光無火者益火之源以消陰翳此謂求其屬也醫家誤昧陰陽陰陽極處沒抓拿亢則害兮承乃制靈蘭秘旨最神良亢則害其物承乃制其極此五行四時迭相為制之理醫家誤昧寒熱顯然寒熱易分別寒中有熱熱中寒須得長沙真秘訣長沙用藥寒因熱用熱因寒用或先寒後熱或先熱後寒或寒熱並舉精妙入神良法具在熟讀精思自然心得然時移世易讀仲景書按仲景法不必泥仲景方而變通用藥尤為得當醫家誤昧虛實顯然虛實何難治虛中有實實中虛用藥東垣有次第脾胃論內外傷辨補中枳朮等方開萬世無窮之利醫家誤藥姑息症屬外邪須克治痞滿燥實病堅牢茶果湯丸何所濟醫家誤藥輕試攻病不知顧元氣病若袪時元氣傷似此何勞君算計輕劑誤事峻劑憤事二者交譏醫家誤不知幾脈動症變只幾希病在未形先著力明察秋毫乃得之病至思治末也見微知著彌患於未萌是為上上醫家誤鮮定見見理真時莫改變恍似乘舟破浪濤把舵良工卻不眩病輕藥應易也定見定守歷險阻而不移起人於垂危之際足徵學識醫家誤強識病病不識時莫強認謙躬退讓遜賢能務俾他人全性命不知為不知亦良醫也醫家誤在刀針針有時宜並淺深膿熟不針則內潰未熟早針則氣泄不成膿膿淺針深則傷好肉膿深針淺則毒不出而肉敗百毒總應先艾灸隔蒜灸法勝於刀針外科正宗云不痛灸至痛痛灸至不痛頭面之上用神燈頭面不宜灸宜用神燈照法外科正宗云內服蟾蜍丸一服外將神燈照三枝此法不止施於頭面而頭面為更要醫家誤薄愚蒙先王矜恤是孤窮病篤必施真救濟好生之念合蒼穹當盡心力施良藥以濟之醫家誤不克己見人開口便不喜豈知芻蕘有一能何況同人說道理醫家誤未已病者誤方興與君還細數請君為我聽病家誤早失計初時抱恙不介意人日虛兮病日增縱有良工也費氣病須早治病家誤不直說諱疾試醫工與拙所傷所作只君知縱有名家猜不出大蘇云我有疾必盡告醫者然後診脈雖中醫亦可治療我但求愈疾耳豈以困醫為事哉病家誤性躁急病有回機藥須吃藥既相宜病自除朝夕更醫也不必既效不可屢更病家誤不相勢病勢沉沉急變計若再蹉跎時日深恐怕回春無妙劑不效則當速更病家誤在服藥服藥之中有竅妙或冷或熱要分明食後食前皆有道病家誤最善怒氣逆衝胸仍不悟豈知肝木克脾元願君養性須回護病家誤苦憂思憂思抑鬱欲何之常將不如己者比知得雄來且守雌病家誤好多言多言傷氣最難痊勸君默口存神坐好將真氣養真元病家誤染風寒風寒散去又復還譬如城郭未完固那堪盜賊更摧殘病家誤不戒口口腹傷人處處有食飲相宜中和氣鼓腹含哺天地久病家誤不戒慎閨房袵席不知命命有顛危可若何願將好色人為鏡病人誤救絕氣病人昏眩時以手閉口而救之也救氣閉口莫閉鼻若連鼻子一齊捫譬如入井復下石鼻主呼吸閉緊則呼吸絕世人多蹈此弊故切言之兩者相誤誤未歇又恐旁人誤重疊還須屈指與君陳好把旁人數一切旁人誤代驚惶不知理路亂忙忙用藥之時偏作主平時可是學岐黃旁人誤引邪路妄把師巫當仙佛有病之家易著魔到底昏迷永不誤更有大誤藥中尋與君細說好留神藥中誤藥不真藥材真致力方深有名無實何能效徒使醫家枉用心都邑大鎮易於覓藥若荒僻處須加細辨藥中誤失炮製炮製不工非劑巿中之藥未蒸炒勸君審度才堪試洗炙蒸煮去心皮殼油尖一一皆不可少藥中誤醜人參或用粗枝枯小參蒸過取湯兼灌錫方中用下卻無功參以原枝乾結為美蒸過取湯則參無寶色錫條可當人參否藥中誤秤不均賤藥多分貴藥輕君臣佐使交相失僨事由來最惱人仍有藥中誤好向水中尋勸君煎藥務得人煎藥誤水不潔油湯入藥必嘔噦暗入聲嘔噦之時病轉增任是名醫審不決煎藥誤水頻添藥爐沸起水加些氣輕力減何能效枉怪醫家主見偏此係醫中百種誤說與君家記得熟記得熟時病易瘳音病癒與君共用大春秋名堂圖臟腑明堂圖附圖臟腑明堂圖腦者髓之海諸髓皆屬於腦上至腦下至尾骶腎主之也兩乳中間名曰膻中為氣聚之海能分佈陰陽不可損也膈膜在心肺之下肝腎之上周回相隔如幕以遮濁氣使不薰蒸上闌門在大小腸之間津液滲入膀胱滓穢流入大腸溺之所出精之所施搖心旌則欲動命門三焦之精從此泄矣人之五臟六腑百骸九竅脈絡盡皆貫通節節相續無有間斷今畫其大略使觀者便覽心係六節腎係七節七節之旁有小心係小心係者命門也由下而上六七節也腎係十四節經言心者君主之官也神明出焉肺者相傅之官治節出焉肝者將軍之官謀慮出焉膽者中正之官決斷出焉膻中者臣使之官喜樂出焉脾胃者倉廩之官五味出焉大腸者傳道之官變化出焉小腸者受盛之官化物出焉腎者作強之官伎巧出焉三焦者浹瀆之官水道出焉膀胱者州都之官津液藏焉氣化則能出矣凡此十二官不得相失也正人明堂圖附圖正人明堂圖手太陰肺經絡起於中府穴終於少商穴手厥陰心包絡起於天地穴終於中衛穴足厥陰肝經絡起於大敦穴終於期門穴手少陰心經絡起於極泉穴終於少衝穴足少陰腎經絡起於湧泉穴終於俞府穴足太陰脾經絡起於隱句穴終於大包穴凡人兩手足各有三陰脈三陽脈以合為十二經也手之三陰從臟走至手手之三陽從手走至頭足之三陰從足上走入腹足之三陽從頭下走至足脈絡傳至周流不息故經脈者行氣血通陰陽以榮於身者也其始從中焦注手太陰陽明手陽明注足陽明太陰足太陰注手少陰太陽手太陽注足太陽少陰足少陰注手心足少陽手少陽注足少陽厥陰足厥陰腹還注手太陰其氣以平旦為紀以漓水下百刻晝夜流行與天同度終而復始也伏人明堂圖附圖伏人明堂圖手太陽小腸經絡起少澤穴終於地宮穴手少陽三焦經絡起於關衛穴終耳門穴足太陽膀胱經起於睛明穴終於至陰穴手陽明大腸經絡起商陽穴終於迎香穴足陽明胃經絡起於頭維終於屬兌穴足少陽膽經絡起於瞳子窌終於竅陰穴凡人脈循十二經環八奇據經合長一十六丈二尺人一呼脈行三寸一吸脈行三寸呼吸定息合行六寸人一日一夜凡一萬三千五百息脈行五十度周於身合行八百十丈漏水下百刻榮衛行陽二十五度行陰二十五度二刻則周身一度也側人明堂圖附圖側人明堂圖經言肺之原出於太淵心之原出於太陵肝之原出於太衛脾之出於太白腎之原出於太谿心之原出於太兌骨即神門也膽之原出於坵墟胃之原出於衛陽三焦之原出於陽池膀胱之原出於京骨大腸之原出於合谷小腸之原出於脘骨見十二經之原又不可不知也嘉慶二十四年恩賜太醫院六品御醫錢松鏡湖氏重鐫道光二十八年雙流縣劉仕廉清臣氏繪書同治十二年蓉城李仲元子乾氏校刻程鍾齡醫門八法論病之原以內傷外感四字括之論病之情則以寒熱虛實表裏陰陽八字統之而論治病之方則又以汗和下消吐清溫補八法盡之蓋一法之中八法備焉八法之中百法備焉病變雖多而法歸於一此予數十年來心領神會曆試而不謬者盡見於八篇中矣學者誠熟讀而精思之於以救濟蒼生亦未必無小補云論汗法汗者散也經云血在皮毛者汗而發之是也又云體若燔炭汗出而散是也然有當汗不汗誤人者有不當汗而汗誤人者有當汗不可汗而妄汗之誤人者有當汗不可汗而又不可以不汗汗之不得其道以誤人者有當汗而汗之不中其經不辨其藥知發而不知斂以誤人者是不可以不審也何則風寒初客於人也頭痛發熱而惡寒鼻塞聲重而體痛此皮毛受病法當汗之若失時不汗或汗不如法以致腠理閉塞榮衛不通病邪深入流傳經絡者有之此當汗不汗之過也亦有頭痛發熱與傷寒同而其人倦怠無力鼻不塞聲不重脈來虛弱此內傷元氣不足之症又有勞心好色真陰虧損內熱晡熱脈細數而無力者又有傷食病胸膈滿悶吞酸噯腐日脯潮熱氣口脈緊者又有寒厥痰逆濕淫腳氣內癰外癰瘀血凝積以及風溫濕溫中暑自汗諸症皆有寒熱與外感風寒似同而實異若誤汗之變症百出矣所謂不當汗而汗者此也若夫症在外感應汗之例而其人臍之左右上下或有動氣則不可以汗經云動氣在右不可發汗汗則衄而渴心煩飲水即吐動氣在左不可發汗汗則頭眩汗不止筋惕肉瞤動氣在上不可發汗汗則氣上衝心中怔悸動氣在下不可發汗汗則無汗心大煩骨節痛食入則吐又脈沉咽燥病已入裏汗之則津液越出大便難而譫語又少陰症但厥無汗而強發之則動血未知從何道出或從耳目或從口鼻出者此為下厥上竭為難治又少陰中寒不可發汗汗則厥逆倦臥不能自溫也又寸脈弱者不可發汗汗則亡陽尺脈弱者不可發汗汗則亡陰也又諸亡血家不可汗汗則直視淋家不可汗汗則便血瘡家不可汗汗則痙又傷寒病在少陽不可汗汗則譫妄又壞病虛人及女人經水適來者皆不可汗若妄汗之變症百出矣所謂當汗不可汗而妄汗誤人者此也夫病不可汗而又不可以不汗則將聽之乎是有道焉傷寒賦云動氣理中去白朮是即於理中湯去朮而加汗藥保元氣而除病氣也又熱邪入裏而表未解者仲景有麻黃石膏之例有葛根黃連黃岑之例是清涼解表法也又太陽症脈沉細少陰症反發熱者有麻黃附子細辛之例是溫中解表法也又少陽中風用柴胡湯加桂枝是和解中兼表法也又陽虛者東垣用補中湯加表藥陰虛者丹溪用芎歸湯加表藥其法精且密矣總而言之凡一切陽虛者皆宜補中發汗凡一切陰虛者皆宜養陰發汗挾熱者皆宜清涼發汗挾寒者皆宜溫經發汗傷食者則宜消導發汗感重而體實者汗之宜重麻黃湯感輕而體虛者汗之宜輕香酥散又東南之地不比西北隆冬開花少霜雪人稟常弱腠理空疏凡用汗藥只需對症不必過重予嘗治傷寒初起專用香酥散加防風川芎秦艽蔓荊等藥一劑愈甚則兩服無有不安而麻黃峻劑數十年來不上兩余可見地土不同用藥迥別其有陰虛陽虛挾寒挾熱兼食而為病者即按前法治之但師古人用藥之意而未嘗盡泥其方隨時隨症酌量處治往往有驗此皆已試之成法而與斯世共白之所以拯災救急者莫切乎此此汗之之道也且三陽之病淺深不同治有次第假如症在太陽而發散陽明已隔一層病在太陽陽明而和解少陽則引賊入門矣假如病在二經而專治一經已遺一經病在三經而偏治一經既遺二經矣假如病在一經而兼治二經或兼治三經則邪過經矣況太陽無汗麻黃為最太陽有汗桂枝可先葛根專主陽明柴胡專主少陽皆的當不易之藥至於九味羌活乃兩感熱症三陽三陰並治之法初非為太陽一經設也又柴葛解肌湯乃治春溫夏熱之症自裏達表其症不惡寒而口渴若新感風寒惡寒而口不渴者非所宜也又傷風自汗用桂枝湯傷暑自汗則不可用若誤用之熱邪愈盛而病必增劇若於暑症而妄行發散復傷津液名曰重暍多致不救古人設為白朮防風例以治風設益元散香茹飲以治暑俾音使把的意思不犯三陽禁忌者良有以也又人知發汗退熱之法而不知斂汗退熱之法汗不出則散之汗出多則斂之斂也者非五味酸棗之謂其謂致病有因出汗有由治得其宜汗自斂耳譬如風傷衛汗自出者以桂枝湯和榮衛祛風邪而汗自止若熱邪傳裏令人汗出者乃熱氣薰蒸如釜中吹煮水氣旁流非虛也急用白虎湯清之若邪已結聚不大便者則用承氣湯下之熱氣退而汗自收矣此與傷暑自汗略同但暑傷氣為虛邪只有清補並行之一法寒傷形為實邪則清熱之外更有攻下止汗之法也復有發散太過遂至汗多亡陽身瞤動欲擗地者宜用真武湯此救逆之良藥與中寒冷汗自出者同類並稱又與熱症汗出者大相徑庭矣其他少陽症頭微汗或盜汗者小柴胡湯水氣症頭汗出者小半夏加茯苓湯至於虛人自汗盜汗等症則歸脾補中八珍十全按法而用委曲尋繹各盡其妙而後即安所謂汗之必中其經必得其藥知發而必知斂者此也嗟嗟百病起於風寒風寒必先客表汗得其法何病不除汗法一差夭枉隨之矣籲汗豈易言哉論和法傷寒在表者可汗在裏者可下其在半表半裏者惟有和之一法焉仲景用小柴胡湯加減是已然有當和不和誤人者有不當和而和誤人者有當和而和不知寒熱之多寡稟質之虛實臟腑之燥濕邪氣之兼併以誤人者是不可不辨也夫病當耳聾脇痛寒熱往來之際應用柴胡湯和解之而或以桂枝麻黃發表誤矣或以大黃芒硝攻裏則亦誤矣又或因其胸滿脇痛而吐之則尤誤矣蓋病在少陽有三禁焉汗吐下是也且非惟汗吐下有所當禁即舍此三法而妄用溫藥均為無益而反有害古人有言少陽膽為清淨之府無出入之路只有和解一法柴胡一方最為切當何其所見明確而立法精微亦至此乎此所謂當和而和者也然亦有不當和而和者如病邪在表未入少陽誤用柴胡謂之引賊入門輕則為瘧重則傳入心胞漸變神昏不語之候亦有邪已入裏燥渴譫語諸症叢集而醫者僅以柴胡治之則病不解至於內傷勞倦內傷飲食氣虛血虛癰腫瘀血諸症皆令寒熱往來似瘧非瘧均非柴胡湯所能去者若不辨明症候切實用藥而借此平穩之法巧為藏拙誤人匪淺所謂不當和而和者此也然亦有當和而和而不知寒熱之多寡者何也夫傷寒之邪在表為寒在裏為熱在半表半裏則為寒熱交界之所然有偏於表者則寒多偏於裏者則熱多而用藥須與之相稱庶陰陽和平而邪氣頓解否則寒多而益其寒熱多而助其熱藥既不平病益增劇此非不和也和之而不得寒熱多寡之宜者也然又有當和而和而不知稟質之虛實者何也夫客邪在表譬如賊甫入門豈敢遽音立刻馬上登吾堂而入吾室必窺其堂奧音泛指室內深處空虛乃乘隙而進是以小柴胡用人參者所以補正氣使正氣旺則邪無所容自然得汗而解蓋由是門入復由是門出也亦有表邪失汗腠理緻密賊無出路由此而傳入少陽熱氣漸盛此不關本氣之虛故有不用人參而和解自愈者是知病有虛實法在變通不可誤也然又有當和而和而不知臟腑之燥濕者何也如病在少陽而口不渴大便如常是津液未傷清潤之藥不宜太過而半夏生薑皆可用也若口大渴大便漸結是邪氣將入於陰津液漸少則辛燥之藥可除而花粉瓜蔞有必用矣所謂臟腑有燥濕之不同者此也然又有當和而和而不知邪之兼併者何也假如邪在少陽而太陽陽明未罷是少陽兼表邪也小柴胡湯加表藥仲景有柴胡加桂枝之例矣又如邪在少陽而兼裏熱則便閉譫語燥渴之症生小柴胡湯中加里藥仲景有柴胡加芒硝之例矣又有三陽合病合目則汗面垢譫語遺尿者用白虎湯和解之蓋三陽同病必連胃腑故以辛涼之藥內清本腑外徹肌膚令三經之邪一同解散是又專以清劑為和矣所謂邪有兼併者此也由是推之有清而和者有溫而和者有消而和者有補而和者有燥而和者有潤而和者有兼表而和者有兼攻而和者和之義則一而和之法變化無窮焉知斯意者則溫熱之治瘟疫之方時行痎瘧皆從此推廣之不難應手而愈矣世人漫曰和解而不能盡其和之法將有增氣助邪而益其爭堅其病者和云乎哉論下法然有當下不下誤人者有不當下而下誤人者有當下不可下而妄下之誤人者有當下不可下而又不可以不下下之不得其法以誤人者有當下而下之不知淺深不分便溺與蓄血不論湯丸以誤人者又雜症中不別寒熱積滯痰水蠱血癰膿以誤人者是不可不察也何謂當下不下仲景云少陽病得之二三日口燥咽乾者急下之少陰病六七日腹滿不大便者急下之下利脈滑數不欲食按之心下鞭者有宿食也急下之陽明病譫語不能食胃中有燥屎也急下之陽明病發熱汗多者急下之少陰病下利清水色純青心下必痛口乾燥者急下之傷寒六七日目中不了了睛不和無表症大便難者急下之此皆在當下之例若失時不下則津液枯竭身如槁木勢難挽回矣然又有不當下而下者何也如傷寒表症未罷病在陽也下之則成結胸病邪雖已入裏而散漫於三陰經絡之間尚未結實若遽下之亦成痞氣況有陰結之症大便反鞭得溫則行如開冰解凍之象又雜病中有高年血燥不行者有新產血枯不行者有病後亡津液者有亡血者有日久不更衣腹無所苦別無他症者若誤下之變症蜂起矣所謂不當下而下者此也然又有當下不可下者何也病有熱邪傳裏已成可下之症而其人臍之上下左右或有動氣則不可下經云動氣在右不可下下之則津液內竭咽燥鼻乾頭眩心悸也動氣在左不可下下之則腹內拘急食不下動氣更劇雖有身熱臥則欲蜷動氣在上不可下下之則掌握煩熱身浮汗泄欲得水自灌動氣在下不可下下之則腹滿頭眩瀉則清榖音落葉喬木樹皮纖維可造紙亦稱構楮心下痞也又咽中閉塞者不可下下之則下輕上重水槳不入蜷臥身疼下利日數十行又脈微弱者不可下脈浮大按之無力者不可下脈遲者不可下喘而胸滿者不可下欲吐欲嘔者不可下病人陽氣素微者不可下下之則呃病人平素胃不能食者不可下病中能食胃無燥屎者不可下小便清者不可下病人腹滿時減復如故者不可下若誤下之變症百出矣所謂當下不可下而妄下誤人者此也然有當下不可下而又不得不下者何也夫以羸弱之人虛細之脈一旦而熱邪乘之是為正虛邪盛最難措手古人有清法焉有潤法焉有導法焉有少少微和之法焉有先補後攻先攻後補之法焉有攻補並行之法焉不可不講也如三黃解毒清之也麻仁梨汁潤之也蜜煎豬膽汁土瓜根導之也涼膈散大柴胡少少和之也更有脈虛體弱不能勝任者則先補之而後攻之或暫攻之而隨補之或以人參湯送下三黃枳朮丸又或以人參瓜蔞枳實攻補並行而不相悖蓋峻劑一投即以參朮歸芍維持調護於其中俾邪氣潛消而正氣安固不愧為王者之師矣又有雜症中大便不通其用藥之法可相參者如老人久病人新產婦人每多大便閉結之症丹溪用四物湯東垣用通幽湯予嘗合而酌之而加以蓯蓉枸杞柏子芝麻松子仁人乳梨汁蜂蜜之類隨手取效又嘗於四物加升麻及前滋潤藥治老人血枯數至圊而不能便者往往有驗此皆委曲疏通之法若果人虛雖傳經熱邪不妨借用寧得猛然一往敗壞真元至成洞瀉雖曰天命豈非人事哉所謂下之貴得其法者此也然又有當下而下而不知淺深不分便溺與蓄血不論湯丸以誤人者何也如仲景大承氣湯必痞滿燥實兼全者乃可用之若僅痞滿而未燥實者仲景只用小承氣湯除去芒硝恐傷下焦陰血也燥實在下而痞滿輕者仲景只用調胃承氣湯除去枳朴恐傷上焦陽氣也又有太陽傷風症誤下而傳太陰以致腹痛者則用桂枝湯加芍藥大實痛者桂枝湯加大黃是解表之中兼攻裏也又有邪從少陽來寒熱未除則用大柴胡湯是和解之中兼攻裏也又結胸症項背強從胸至腹鞭滿而痛手不能近者仲景用大陷胸湯若不按不痛者只用小陷胸湯若寒食結胸用三白散熱藥攻之又水結胸頭出汗者用小半夏加茯苓湯水停脇下痛不可忍者則用十棗湯凡結胸陰陽二症服藥罔效活人倶用枳實理中丸應手而愈又河間三書云鬱熱蓄甚神昏厥逆脈反滯澀有微細欲絕之象世俗未明造化之理投以溫藥則不可救或者妄行攻下致殘陰暴絕勢大可危不下亦危宜用涼膈散合解毒湯養陰退陽積熱藉以宣散則心胸和暢而脈漸以生此皆用藥淺深之次第也又如太陽症未罷口渴小便短澀大便如常此為溺澀不通之症治用五苓散又太陽傳本熱結膀胱其人如狂小腹硬滿而痛小便自利者此為蓄血下焦宜抵當丸若蓄血輕微但少腹急結未至硬滿者則用桃仁承氣湯或用生地四物湯加酒洗大黃各半下之尤為穩當蓋溺澀症大便如常燥糞症小便不利蓄血症小便自利大便色黑者此便溺蓄血之所由分也血結膀胱病勢最急抵當湯稍輕者抵當丸結胸惡症悉具則用大陷胸湯稍輕者大陷胸丸其他蕩滌腸胃推陳致新之法則皆用湯古人有言凡用下藥攻邪氣湯劑勝丸散誠以熱淫於內用湯液滌除之為清淨耳此湯丸之別也然又有雜症中不別寒熱積滯老痰水蠱血積癰膿以誤人者何也東垣治傷食症腹痛便閉拒按者因於冷食用見蜆丸因於熱食用三黃枳朮丸若冷熱互傷則以二丸酌其所食之多寡而互用之應手取效又實熱老痰滾痰丸水腫實症神佑丸蠱積剪紅丸血積花蕊丹失笑丸腸癰牡丹皮散隨症立方各有攸宜此雜症攻下之良法也近世病家不講於法每視下藥為畏途病者亦視下藥為砒鳩砒鳩音砒為砷的舊稱鳩為鳩鴿科的鳥的泛稱致令熱症垂危袖手旁觀委之天數大可悲耳昔張子和儒門事親三法即以下法為補謂下去其邪而正氣自復穀肉果菜無在而非補養之物雖其說未合其宜而於治病攻邪之法正未可缺吾願學者仰而思之平心而察之得其要領以施救濟之方將以躋斯民於壽域不難矣論消法消者去其壅也臟腑經絡肌肉之間本無此物而忽有之必為消散乃得其平經云堅者削之是已然有當消不消誤人者有不當消而消誤人者有當消而消之不得其法以誤人者有消之而不明部分以誤人者有消之而不辨夫積聚之原有氣血積食停痰蓄水癰膿蟲蠱勞瘵痃癖癥瘕七疝胞痹腸覃石瘕以及前後二陰諸疾以誤人者是不可不審也凡人起居有常飲食有節和平恬淡氣血周流穀神充暢病安從來惟夫一有不慎則六淫外侵七情內動飲食停滯邪日留止則諸症生焉法當及時消導俾其速散氣行則愈耳倘遷延日久積氣盤踞堅牢日漸強大有欲拔不能之勢雖有智者亦難為力此當消不消之過也然亦有不當消而消者何也假如氣虛中滿名之曰鼓腹皮膨急中空無物取其形如鼓之狀而因以名之此為敗症必須填實庶乎可消與蠱症之為蟲為血內實而有物者大相徑庭又如脾虛水腫土衰不能制水者非補土不可真陽大虧火衰不能生土者非溫暖命門不可又有脾虛食不消者氣虛不能運化而生痰者腎虛水泛為痰者血枯而經水斷絕者皆非消導所可行而或妄用之誤人多矣所謂不當消而消者此也然又有當消而消之不得其法者何也夫積聚瘕癥瘕音女腹中結塊病之症有初中末之三法焉當其邪氣初客所積未堅則先消之而後和之及其所積日久氣鬱漸深濕熱相生塊因漸大法從中治當祛濕熱之邪削之軟之以底於平但邪氣久客正氣必虛須以補瀉疊相為用如薛立齋用歸脾湯送下蘆薈丸予亦嘗用五味異功散佐以和中丸皆攻補並行中治之道也若夫塊消及半便從末治不使攻擊但補其氣調其血導達其經脈俾榮衛流通而塊自消矣凡攻病之藥皆損氣血不可過也此消之之法也然又有當消之而不明部分者何也心肝脾肺腎分佈五方胃大腸小腸膀胱三焦膽與膻中皆附麗有常所而皮毛肌肉筋骨各有淺深凡用湯丸膏散必須按其部位而君臣佐使駕馭有方使不得移則病處當之不至誅伐無過矣此醫門第一義也而於消法為尤要不明乎此而行有克削則病未消而元氣已消其害可勝言哉況乎積聚之原有氣血食積停痰蓄水癰膿蟲蠱癆瘵音病多指癆病與夫痃癖癰瘕七疝胞痹腸覃石瘕以及前後二陰諸疾各個不同若不明辨為害匪輕予因略約而指數之夫積者成於五臟推之不移者也聚者成於六腑推之則移者也其忽聚忽散者氣也痛有定處而不散者血也得食則痛噯腐吞酸者食積也腹有塊按之而軟者痰也先足腫後及腹者水也先腹滿後及四肢者脹也痛引兩肋咳而吐涎者停飲也咳而胸痛吐膿腥臭者肺癰也當胃而痛嘔而吐膿者胃脘癰也當臍而痛小便如淋轉側作水聲者腸癰也增寒壯熱飲食如常身有痛偏著一處者外癰也病人嗜食甘甜或異味饑時則痛唇之上下有白斑點者蟲也蟲有九濕熱所生而為蛇為鱉則血之所成也胡以知為蛇鱉腹中如有動物痛不可忍吃血故也又嶺南之地以蠱害人施於飲食他方之蠱多因近池飲冷陰受蛇虺之毒也病人咳嗽痰紅抑抑不樂畏見人喉癢而咳劇者癆瘵生蟲也痃如弓弦筋病也癖則隱癖附骨之病也癥則有塊可徵積之類也瘕者或有或無痞氣之類也少腹如湯沃小便澀者胞痹也痛引睾丸疝也女人經水自行而腹塊漸大如懷子者腸覃也經水不行而腹塊漸大並非妊者石瘕也有孕無孕可於脈之滑澀辨之也至於濕熱下墜則為陰菌陰蝕陰挺下脫陰莖腫爛之類而虛火內爍庚金則為痔漏為懸癰為臟毒種種見症不一而足務在明辨症候按法而消之也醫者以一消字視為泛常而不知其變化曲折較他法為尤難則奈何不詳稽博考以盡濟時之仁術也耶論吐法吐者治上焦也胸次之間咽喉之地或有痰食癰膿法當吐之經曰其高者因而越之是已然有當吐不吐誤人者有不當吐而吐以誤人者有當吐不可吐而妄吐之以誤人者亦有當吐不可吐而又不可以不吐吐之不得其法以誤人者是不可不辨也即如纏喉鎖喉諸症皆風痰鬱火壅塞其間不急吐之則脹閉難忍矣又或食停胸膈消化弗及無由轉輸脹滿疼痛者必須吐之否則胸鬲滿悶變症莫測矣又有停痰蓄飲阻塞清道日久生變或防礙飲食或頭眩心悸或吞酸噯腐手足麻痹種種不齊宜用吐法導其痰諸症如失又有胃脘癰嘔吐膿血者經云嘔家有膿不須治嘔膿儘自愈凡此皆當吐而吐者也然亦有不當吐而吐者何也如少陽中風胸滿而煩此邪氣而非有物不可吐吐則驚悸也又少陰病始得之手足厥冷飲食入口則吐此膈上有寒飲不可吐也病在太陽不可吐吐之則不能食反生內煩雖曰吐中有散然邪氣不除已為小逆也此不當吐而吐者也然又有當吐不可吐者何也蓋凡病用吐必察其病之虛實因人取吐先察其人之性情不可誤也夫病在上焦可吐之症而其人病勢危篤或老弱氣衰者或體質素虛脈息微弱者婦人新產者自吐不止者諸亡血者有氣動者四肢厥冷冷汗自出者皆不可吐吐之則為逆候此因其虛而禁吐也若夫病久之人宿積已深一行吐法心火自降相火必強設犯房勞轉生虛症反難救藥更須戒恕凝神調息靜養越三旬而出戶方為合法如其人性氣剛暴好怒喜淫不守禁忌將何恃以無恐此又因性情而禁吐也所謂當吐不可吐者此也然有不可吐而又不得不吐者何也病人脈滑大胸膈停痰胃脘積食非吐不除食用瓜蒂散與桔紅淡鹽湯痰以二陳湯用指探喉中而出之體質極虛者或以桔梗煎湯代之斯為穩當而予更有法治焉予嘗治寒痰閉塞厥逆昏沉者常用半夏桔紅各八錢濃煎半杯和薑汁成一杯頻頻灌之痰隨藥出則拭之隨灌隨吐隨吐隨灌少頃痰開藥下其人即蘇如此者甚眾又嘗治風邪中臟將脫之症其人張口痰鳴聲如曳鋸溲便自遺者更難任治皂角等藥切不可用亦不暇用因以大劑參附薑夏濃煎灌之藥隨痰出則拭之隨灌隨吐隨吐隨灌久之藥力下嚥胸膈流通參附大進立至數兩其人漸醒一月之間參藥數斤遂至平復如此者又眾又嘗治風痰熱閉之症以牛黃丸灌如前法頸疽內攻藥不得入者以蘇藿香丸灌如前法風熱不語者以解語丹灌如前法中暑不醒者以消暑丸灌如前法中惡不醒者以前項桔半薑汁灌如前法魔夢不醒者以連須蔥白煎酒灌如前法自縊不醒者以肉桂三錢煎水灌如前法喉閉喉風以鮮杜牛膝搗汁雄黃丸等灌如前法俱獲全安如此者又眾更有牙關緊急閉塞不通者以搐鼻散吹鼻取嚏嚏出牙開或痰或食隨吐而出其人遂蘇如此者尤眾蓋用藥隨藥取吐不吐之吐其意更深此皆古人之成法而予稍為變通者也昔仲景治胸痛不能食按之反有涎吐下利日數十行吐之則利止是以吐痰止利也丹溪治孕婦轉脬脬音膀胱小便不通用補中益氣湯隨服而探吐之往往有驗是以吐法通小便也華佗以醋蒜吐蛇河間以狗油雄黃同瓜蒂以吐蟲而通膈丹溪又以韮汁去瘀血以治前症由此觀之症在危險之際古人恒以通劑盡其神化莫測之用況於顯然易見者乎則甚矣吐法之宜講也近世醫者每將此法置之高閣亦似汗下之外並無吐法以致病中常有自吐自嘔而為順症者見者驚聞者駭醫家亦不論虛實而亟亟止之反成壞病害人多矣籲可不畏哉論清法清者清其熱也臟腑有熱則清之經云熱者寒之是已然有當清不清誤人者有不當清而清誤人者有當清而清之不分內傷外感以誤人者有當清而清之不量其人不量其症以誤人者是不可不察也夫六淫之邪除中寒寒濕外皆不免於病熱熱氣薰蒸或見於口舌唇齒之間或見於口渴便溺之際灼知其熱而不清則斑黃狂亂厥逆吐衄諸症叢生不一而足此當清不清之誤也然又有不當清而清者何也有如勞力辛苦之人中氣大虛發熱倦怠心煩溺赤名曰虛火蓋春生之令不行無陽以護其榮衛與外感熱症相隔天壤又有陰虛勞瘵之症日哺潮熱與夫產後血虛發熱煩燥症象白虎誤服白虎者難救更有命門火衰浮陽上泛有似於火者又有陰盛格陽假熱之症其人面赤狂躁欲坐臥泥水中或數日不大便或舌黑而潤或脈反洪大崢崢然如鼓擊於指下按之豁然而空者或口渴欲得冷飲而不能下或因下元虛冷頻飲熱湯以自救世俗不識誤投涼藥下嚥即危矣此不當清而清之誤也然又有當清而不分內傷外感者何也蓋風寒閉火則散而清之經云火鬱發之是也暑熱傷氣則補而清之東垣清暑益氣湯是也濕熱之火則或散或滲或下而清之開鬼門潔淨府除陳莖是也燥熱之火則潤而清之通大便也傷食積熱則消而清之火去食自平也惟夫傷寒傳入胃腑熱勢如蒸自汗口渴飲冷而能消水者藉非白虎湯之類鮮克有濟也更有陽盛拒陰之症清藥不入到口隨吐則以生薑汁少許為引或薑製黃連反佐以取效所謂寒因熱用是也此外感實火之清法也若夫七情六欲喜怒憂思悲恐驚互相感觸火從內發丹溪治以越鞠丸開六鬱也立齋主以逍遙散調肝氣也意以一方治木鬱而諸鬱皆解也然經云怒則氣上喜則氣緩悲則氣消恐則氣下驚則氣亂思則氣結逍遙一方以之治氣上氣結者固為相宜而於氣緩氣消氣亂氣下之症恐猶未合蓋氣虛者必補其氣血虛者必滋其血氣旺血充而七情之火悠焉以平至若真陰不足而火上炎者壯水之主以鎮陽光真陽不足而火上炎者引火歸源以導龍入海此內傷虛火之治法也或者曰病因於火而以熱藥治之何也不知外感之火邪火也實火也有形之火後天之火也得水則滅故可以水折內傷之火虛火也龍雷之火也無形之火先天之火也得水則炎故不可以水折譬如龍得水而愈奮飛雷因雨而益震動陰濛沉晦之氣光焰燭天必俟云收日出而龍雷各歸其宅耳是以虛火可補而不可瀉也其有轉用參耆而不用八味者因其穴宅無寒也其有專用六味而不用桂附者因其穴宅無水也補則同而引之者稍不同耳蓋外感之火以涼為清內傷之火以補為清也然又有清之而不量其人者何也夫以壯實之人而患實熱之病清之稍重尚為無礙若本體素虛臟腑本寒飲食素少腸胃虛滑或產後病後房室之後即有熱症亦宜少少用之寧可不足不使有餘或餘熱未清即以輕藥代之庶幾病去人安倘清劑過多則病熱未已而寒生矣此清之貴量其人也然又有清之而不量其症者何也夫以大熱之症而清劑太微則病不除微熱之症而清劑太過則寒症即至但不及猶可再清太過則難醫藥矣且凡病清之而不去者猶有法焉壯水是也王太僕云大熱而甚寒之不寒是無水也當滋其腎腎水者天真之水也取我天真之水以制外邪何邪不服何熱不除而又何必拘於寒涼以滋罪戾乎由是觀之外感之火尚當滋水以制之而內傷者更可知矣大抵清火之藥不可久恃必歸本於滋陰滋陰之法又不能開胃扶脾以恢復元氣則參苓耆朮亦當酌量而用非曰清後必補但元氣無虧者可以不補元氣有虧者必須補之俟其飲食漸進精神爽慧然後止藥可也此清之貴量其症也總而言之有外感之火有內傷之火外感為實內傷為虛來路不同治法迥別寧曰熱者寒之遂足以畢醫家之能事也乎論溫法溫者溫其中也臟受寒侵必須溫劑經云寒者熱之是已然有當溫不溫誤人者即有不當溫而溫以誤人者有當溫而溫之不得其法以誤人者有當溫而溫之不量其人不量其症與其時以誤人者是不可不審也天地殺厲之氣莫甚於傷寒其自表而入者初時即行溫散則病自除若不由表入而直中陰經者名曰中寒其症惡寒厥逆口鼻氣冷或冷汗自出嘔吐瀉利或腹中急痛厥逆無脈下利清穀種種寒症並見法當溫之又或寒濕侵淫四肢拘急發為痛脾亦宜溫散此當溫而溫者也然又有不當溫而溫者何也如傷寒熱邪傳裏口燥咽乾便閉譫語以及斑黃狂亂衄吐便血諸症其不可溫固無論矣若乃病熱已深厥逆漸進舌則乾枯反不知渴又或挾熱下利神昏氣弱或脈來澀滯反不應指色似煙熏形如槁木近之無聲望之似脫甚至血液衰耗筋脈拘攣但唇口齒舌乾燥而不可解者此為真熱假寒之侯世俗未明亢害承制之理誤投熱劑下嚥即敗矣更有鬱熱內蓄身反惡寒濕熱脹滿皮膚反冷中暑煩心脈虛自汗燥氣焚金痿軟無力者皆不可溫又有陰虛脈細數陽乘陰而吐血者亦不可溫溫之則為逆侯此所謂不當溫而溫者也然又有當溫而溫之不得其法者何也假如冬令傷寒則溫而散之冬令傷風則溫而解之寒痰雍閉則溫而開之冷食所傷則溫而消之至若中寒暴痛大便反鞭溫藥不愈者則以熱劑下之時當暑月而納涼飲冷暴受寒侵者亦當溫之體虛挾寒者溫而補之寒客中焦理中湯溫之寒客下焦四逆湯溫之又有陰盛格陽於外溫藥不效者則以白通湯加人尿豬肝汁反佐以取之經云熱因寒用是已復有真虛挾寒命門火衰者必須補其真陽太僕有言大寒而盛熱之不熱是無火也當補其心此心字指命門而言仙經所謂七節之旁中有小心是也書云益心之陽寒亦通行滋腎之際熱之尤可是也然而醫家有溫熱之溫有溫存之溫參耆歸朮和平之性溫存之溫也春日煦煦是也附子薑桂之性溫熱之溫也夏日烈烈是也和煦之日人人可近燥烈之日非積雪凝寒開冰解凍不可近也更有表裏皆寒之症始用溫藥裏寒頓除表邪未散復傳經絡以致始為寒中而其後轉變為熱中者容或有之籍非斟酌時宜對症投劑是先以溫藥救之繼以溫藥賊之矣亦有三陰直中初無表邪而溫劑太過遂令寒退熱生初終異轍是不可以不謹所謂溫之貴得其法者此也然又有溫之不量其人者何也夫以氣虛無火之人陽氣素微一旦客寒乘之則溫劑宜重且多服亦可無傷若其人平素火旺不喜辛溫或曾有陰虛失血之症不能用溫者即中新寒溫藥不宜太過病退則止不必盡劑斯為克當其人也若論其症寒之重者微熱不除寒之輕者過熱則亢且溫之與補有相兼者有不必相兼者虛而且寒則兼用之若寒而不虛即專以溫藥主之丹溪云客寒暴痛兼有積食者可用桂附不可遂用人參蓋溫即是補予遵其法先用薑桂溫之審其果虛然後以參朮補之是以屢用屢驗無有差忒此溫之貴量其症也若論其時盛夏之月溫劑宜輕時值隆冬溫劑宜重然亦有時當盛暑而得虛寒極重之症曾用參附煎膏而治癒者此捨捨釋也從手舍聲說文時從症法也譬如霜降以後禁用白虎湯然亦有陽明症蒸熱自汗譫語煩燥口渴喜飲冷者雖當雨雪飄搖之際亦曾用白虎治之而痊安但不宜太過耳此溫之貴量其時而清劑可類推已邇時醫者群尚溫補痛戒寒涼且曰陽為君子陰為小人又曰陽為君子苟有過人必知之誠以知之而即為補救尤可言也不思藥以療病及轉療藥則病必增劇而成危險之候又況桂枝下嚥陽盛則殆承氣入胃陰盛以敗安危之機禍如反掌每多救援弗及之處仁者鑒此顧不痛歟吾願醫者精思審處晰理不差於毫釐用藥悉歸於中正俾偏陰偏陽之藥無往不底於中和斯為善治噫可不勉哉論補法補者補其虛也經曰不能治其虛安問其餘又曰邪之所湊其氣必虛又曰精氣奪則虛又曰虛者補之補之為義大矣哉然有當補不補誤人者有不當補而補誤人者亦有當補而不分氣血不辨寒熱不識開合不知緩急不分五臟不明根本不深求調攝之方以誤人者是不可不講也何謂當補不補夫虛者損之漸損者虛之積也初時不覺久則病成假如陽虛不補則氣日消陰虛不補則血日耗消且耗焉則天真榮衛之氣漸絕而虧損成矣雖欲補之將何及矣又有大虛之症內實不足外似有餘脈浮大而澀面赤火炎身腫頭眩煩躁不寧此為出汗暈脫之機更有精神浮散徹夜不寐者其禍尤速法當歸脾養榮輩加斂藥以收攝元神俾浮散之氣退藏與密庶幾可救復有陰虛火亢氣逆上衝不得眠者法當滋水以制之切忌苦寒瀉火之藥反傷真氣若誤清之去生遠矣古人有言至虛有盛候反瀉含冤者此也當補不補之誤也然又有不當補而補者何也病有脈實症實不能任補者固無論矣即其人本體素虛而客邪初至病勢方張若驟補之未免閉門留寇更有大實之症積熱在中脈反細澀神昏體倦甚至憎寒振怵欲著覆衣酷肖虛寒之象而其人必有唇焦口燥便閉溺赤諸症與真虛者相隔天淵倘不明辨精切誤投補劑陋矣古人有言大實有贏狀誤補益疾者此也此不當補而補之之誤也然亦有當補而補之不分氣血不辨寒熱者何也經曰氣主煦之血主濡之氣用四君子湯凡一切補氣藥皆從此出也血用四物湯凡一切補血藥皆從此出也然而少火者生氣之原丹田者出氣之海補氣而不補火者非也不思少火生氣而壯火即食氣譬如傷暑之人四肢無力濕熱成痿不能舉動者火傷氣也人知補火可以益氣而不知清火亦可以益氣補則同而寒熱不同也又如血熱之症宜補血行血以清之血寒之症宜溫經養血以和之立齊治法血熱而吐者謂之陽乘陰迫血而妄行也治用四生丸六味湯血寒而吐者謂之陰乘陽如天寒地凍水凝冰也治用理中湯加當歸醫家常須識此勿令誤也更有去血過多成升鬥者無分寒熱皆當補益所謂血脫者益其氣乃陽生陰長之至理蓋有形之血不能速生無形之氣所當急固以無形生有形先天造化本如是耳此氣血寒熱之分也然又有補之而不識開合而不知緩急者何也天地之理有合必有開用藥之機有補必有瀉如補中湯用參耆必用陳皮以開之六味湯用地黃即用澤瀉以導之古人用藥補正必兼瀉邪邪去則補自得力又況虛中挾邪正當開其一面戢我人民攻彼賊寇或縱或擒有收有放庶幾賊退民安而國本堅固更須酌其邪正之強弱而用藥多寡得宜方為合法是以古方中有補散並行者參蘇飲益氣湯是也有消補並行者枳朮丸理中丸是也有攻補並行者瀉心湯芒硝丸是也有溫補並行者治中湯參附湯是也有清補並行者參連飲人參白虎湯是也更有當峻補者有當緩補者有當平補者如極虛之人垂危之病非大劑湯液不能挽回予嘗用參附煎膏日服數兩而救陽微將脫之症又當用參麥數兩煎膏而救津枯之症亦有無力服參而以耆朮代之者隨時處治往往有功至於病邪未盡元氣雖虛不任重補則從容和緩以補之相其機宜循序漸進脈症相安漸為減藥穀肉菜果食養盡之以底於平康其有體質素虛別無大寒大熱之症欲服丸散以保真元者則用平和之藥調理氣血不敢妄使偏僻之方久而爭勝反有傷也此開合緩急之意也然又有補之而不分五臟者何也夫五臟有正補之法有相生而補之之法難經云損其肺者益其氣損其心者和其榮衛損其脾者調其飲食適其寒溫損其肝者緩其中損其腎者益其精此正補也肺虛者補脾土生金也脾虛者補命門火生土也心虛者補肝木生火也肝虛者補腎水生木也腎虛者補肺金生水也此相生而補之也而予更有根本之說焉懷胎時形骸未成先生兩腎腎者先天之根本也囡地一聲一事未知先求乳食是脾者後天之根本也然而先天之中有水有火水曰真陰火曰真陽名之曰真則非氣非血而為血氣之母生身生命賴乎此周曰無極之真二五之精妙合而凝寂然不動感而遂通隨吾神以為往來者此也古人深知此理用六味滋水八味補火十補斑龍水火兼濟法非不善矣然而以假補真必其真者未曾盡喪庶幾有數若先天祖氣蕩然無存雖靈芝亦難續命而況庶草乎至於後天根本尤當培養不可忽視經曰安穀則昌絕穀則危又云粥漿入胃則虛者活古人診脈必曰胃氣製方則曰補中又曰歸脾健脾者良有以也夫飲食入胃分佈五臟灌溉周身如兵家之糧餉如民家之煙火一有不繼兵民離散矣然而因餓致病者固多而因傷致病者亦復不少過嗜肥甘則痰生過嗜醇釀則飲積瓜果乳酥濕從內受發為腫滿泄利五味偏啖久而增氣皆令夭殃可不慎哉是知脾腎兩臟皆為根本不可偏廢古人或謂補脾不如補腎者以命門之火可生脾土也或謂補腎不如補脾者以飲食之精自能下注於腎也須知脾弱而腎不虛者則補脾為亟腎弱而脾不虛者則補腎為先若脾腎兩虛則並補之藥既補矣更加攝養精神斯為善道諺有之曰藥補不如食補我則曰食補不如精補精補不如神補節飲食惜精神用藥得宜病有不痊焉者寡矣
