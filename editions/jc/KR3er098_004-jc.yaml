body:
  text: 醫學集成卷四病論六則清臣曰予生多疾始入醫門凡與人診脈看病必先論病然後立方注明何證應用何藥如何治法醫有證據病家了然以便更改藥方即另延醫士亦知前法更有把握是業醫之道務要虛心領會以活人為念切莫固執不通自以為是誤人一命終還一命慎之恭論吳又香老夫子貴恙六脈浮大中空面赤唇紅虛陽外現所吐之血滿地成團實因誤服寒涼所致治法應宜溫中固腎以鎮陰血但刻下血離經絡驟熱不宜驟止不可必須引血歸經毫不妄行後用理脾健胃其患自愈未知是否敬呈薌翁明府大人斧正引血歸經方酒白芍六錢炙甘草二錢川鬱金三錢花蕊石二錢降真香二錢側柏為引此方係甲己化土之法用白芍為甲木以斂肝血甘草為己土以培脾胃川鬱金能開十二經絡花蕊石行血中之氣降真香行氣中之血引用側柏和血生血不止血而血自止是行血即所以止血服到血歸經絡再服理脾健胃之品此千古不易之法也理脾健胃方蜜黃耆八錢焦於木三錢炮薑灰一錢西砂仁二錢法半夏二錢破故紙三錢制附片三錢益智仁二錢花蕊石二錢降真香二錢側柏葉引此方用耆術以大固中州用薑灰砂半醒脾崇土故紙收攝腎氣附片溫暖下元智仁納氣歸腎仍用花蕊降香兼行滯氣服到咽乾唇燥去花蕊重加熟地白芍或天冬五味再服大補元煎或左右歸丸大劑為丸告厥成功益壽延年雙流劉清臣敬擬予論子和彭狀元貴疾六脈洪大鼓指口臭氣粗裏熟太重以致赤白下利日夜數十度非大劑與之難以捷效法宜寬腸去滯行臭逐瘀慎服溫熱收澀之品謹擬一方列後行滯逐瘀方當歸二兩白芍一兩六錢檳榔三錢厚朴三錢萊菔二錢廣香二錢引用苦薤子五個引方重用當歸為君使大腸有傳道之機護守脂膏重用白芍為臣斂肝養血使木不克土不成禁口用檳榔厚朴為佐推蕩胸膈用萊菔廣香寬腸去滯薤子行臭逐瘀如肛門似烙加黃連裏急後重加大黃一劑輕再劑愈矣恭論渭春中丞大人貴恙肝脾二經脈勢滯澀外見目黃溺赤汗出染衣此陽疸證也治法應宜燥濕利水兼退膽熱三劑可愈敬呈大人閣下斧正燥濕退疸方茅蒼朮三錢焦白朮三錢粉豬苓二錢白茯苓二錢川澤瀉二錢西茵陳二錢引用三角風一把酒炒入藥同煎此方用蒼朮白朮以燥濕用茯苓豬苓澤瀉以利水茯苓去氣分之水豬苓去血分之水澤瀉去腎中凡水茵陳退膽經餘熱三角風用酒炒為引能驅五種黃疸三劑可愈俟黃色盡退始服補脾固腎之品再以精氣神平補之方善後則長生不老矣予論張少君貴恙係陰寒凝滯腮肋俱腫唇白麵青經紋沉細險危之候似為清涼所誤迄今月餘實屬陰氣凝結治法非麻黃不能開其腠理非薑桂不能化其凝結余用理脾健胃之品輔正脫邪謹擬二方於左清腫破結方焦白朮三錢西砂仁二錢上安桂一錢炮乾薑一錢麻黃絨一錢霍香引外敷腮腫方硫磺二兩荍面一兩麥面一兩用熱水調敷腫處後三日信到云腫消病癒再求培補方可知用藥對症奏效甚捷愚本庸醫妄論貴疾封翁吳老大人係先天命門火衰不能薰蒸後天脾土以致飲食減少痿軟無力舌黑如墨真陽盡為陰氣蒙蔽治法應宜大固中州宣暢胸膈峻補腎陽溫暖下元納氣歸腎驅陰救陽則長生不老壽溢期頤矣敬擬一方恭呈廉翁方伯大人哂政是幸延壽方蜜北耆八錢於潛術四錢高麗參四錢白蔻仁一錢法半夏二錢鮮枸杞三錢杭巴戟三錢制附片三錢嫩鹿茸三錢益智仁二錢煨薑紅棗引此方用參耆朮以大固中州白蔻半夏宣暢胸膈枸杞巴戟峻補腎陽附片益智鹿茸溫暖下元納氣歸腎服到口乾舌紅始加熟地一兩當歸八錢官燕六錢蒙桂三錢改湯為丸隨意多服則精神強固清臣弟謂公庭周老夫子貴體未安因是非場中諸醫不至弟屬親誼勢所難辭細察病情實由受傷感冒舌白麵青大燒不止審其六脈浮沉俱緊明係外受風寒內聚瘀血治法驅風散寒追逐瘀血未知當否單呈各台斧正是荷散寒追逐方羌活頭二錢西防風二錢竹柴胡三錢桂枝尖二錢當歸尾二錢赤芍藥二錢桃仁泥二錢鮮紅花二錢生薑甜酒引此方前四味驅風散寒後四味追逐瘀血如不出汗下血無多再加麻黃一錢大黃二錢恭論貫槎吳大老爺貴體縱云微和尚屬無礙年近古稀脈出虎口壽考之徵況先後兩天俱足陽臟陽脈君曰怔忡余曰非也惕惕然有所動者為怔築築然有所動者為忡有物所觸者為驚無物所觸者為悸然怔忡驚悸名雖不同治法無異不必服蠻煎正心丹茯苓補心湯等方施治予從脈息有餘調理怔忡驚悸自除日夜均安百病俱失再能怡養性天則福壽延長矣脈息有餘方生熟地各八錢明天冬四錢寸麥冬四錢全當歸三錢赤芍藥二錢杭菊花二錢白雲苓二錢熟大黃一錢元明粉一錢竹心車前引此方全用滋水養肝消風解熱平金潤燥推蕩鬱熱以大便行一二次後早服天王補心丹夜服歸脾湯其患立愈隨作怡養曲授彭山縣吳貫槎清廉吏也籍隸湘南秋闈見躓由諸生從戎克復數城選舉武陽雖年愈花甲運甓音磚古代又稱瓴甓尤勤公退之睱抱恙怔忡延予就治予略暗岐黃稍知玄妙診得六脈健旺兩天俱足服藥百劑不如靜鎮一時古詩云靜者心多妙又萬物靜觀皆自得按之實養心術也因不揣固陋作怡養一曲為獻少年人到暮年老暮年更比少年好常學含飴且弄孫閑看奇花閑聽鳥君性喜清廉我性喜參考同性復同心為君脫詩稿養性情除煩惱快樂多勞若少字何必張顛詩何必賈島酒何必劉伶藥何必思邈勿求曼倩桃勿覓安期棗是非隨處忘得失隨時了形神莫過勞飲食莫過飽臥不待更寒起必待天曉桑者閑勞人草涵養深精神保輔養刀圭切莫遲調和水火還須早怡養性天到百年此心莫使憧憧擾醫案九條清臣曰余生所治奇情怪疾難以數記總在靈機應變活法救人認定陰陽守定經絡分明虛實辨清表裏細查情形講究脈息再四思維論病立方斯無遺誤迄今年邁奏效雖多不復記憶謹書數案以開來學曾治雪橋牛大人腳疾臥床月餘痛處難堪不能步履延予調治撲榻見禮診其六脈搭手洪大無倫重按至骨乃見察其面舌青黯色白問其痛處不在筋骨盡在肉中空處毫無定所予知其為陽痿症也究其前方皆三氣飲獨活寄生之類余以十全大補去芎苓加附片巴戟枸杞鹿茸益智大劑與之一劑而安再劑則行動如常復以此方為丸多服精神強固今七十又六尚能主講錦江書院曾治楊慶伯老太夫人患夾食傷寒延予診治六脈沉澀舌胎滿口面青唇白印堂下青筋高鼓飲食無味險危已極實由補劑太早所致也余曰論壽高困倦應宜峻補但此時此際欲扶正氣則邪氣難除欲驅邪氣而正氣將脫醫家束手於無可如何之中設一權變之法遵金鑒補瀉兼施輔正黜邪未知是否敬呈臬司大人斧正大人曰聽君為之余以枳朮丸加厚朴大黃牙皂服之舌胎盡退日食雙弓米兩次下榻賞給奴婢已安泰十日矣適駱制軍送大參一支自用缸熬病者喜服從三更服至天明氣喘汗出大汗亡陰不可救藥可知大黃救人無功人參殺人無過同治六年三日見兩病之誤一中河場李廷鼎患陰症傷寒人以瘟疫治之待余往視嗜臥不語舌黑脈微諸醫畢集問余曰係屬何症以陰症寒答之當用何藥以附子乾薑應之又問先生驗舌與周身否余應之曰備細看明六脈尋筋不見四肢逆冷舌黑是真陽埋沒周身是陰毒外現再服寒涼不可救藥隨擬一方群醫吐舌以附片八錢為君乾薑肉桂各三錢為臣西砂半夏各二錢為佐故紙胡巴各三錢為輔麻黃細辛各六分為使薑棗引服一次舌黑全退二次陰毒盡消一劑服完諸症皆愈二劑去麻黃細辛加潞音古水名即今山西濁漳河黨一兩此陰症誤認為陽症也彭場余星棲之兄余煥章患瘟疫人以陽虛酒病治之待予往觀群醫滿座桂附參耆一一用遍予入病室見氣噴如火口臭氣粗面紅舌燥痞滿堅實俱備未診脈已知其為熱症也及診得脈息七至急下症也主方白虎承氣湯加桃仁牙皂立單後聊書數語此瘟疫症也下之宜急若再遲延則不可救眾醫一言不答病家狐疑不定適有伊家館師焦聘三出視單目直告曰前藥愈治癒危全無一效今清臣單目注明不服此藥一無所救定服此方大下而愈此熱症誤認為虛症也不活於醫而活於焦氏者矣開縣李宗義之姪李章甫陳薌墀門生也丁卯科應鄉試二場後少陰腹痛吐瀉並行不能入場險危之極延予調治予以理脾滌飲合吳萸附子細辛湯加肉蔻炮薑而愈彼此視為莫逆在蓉垣官廨音舊時官吏辦公的地方同陳步香韓立堂吟詠唱和暢懷遊覽云及家規力勤守約伊叔雖現任江南總督持家有法淡飯布衣謹守八本堂遺訓聊摘二語以見胸襟做官以不要錢為本行軍以不擾民為本同居三月不忍分袂薛濤井載酒聯詩餞別封翁吳嘯云錢塘名士年逾古稀每有疾患延予調治壽高衰老不過滋養培補而已予喜嘯云有孝子賢孫每次就榻伊子廉生侍立其旁並無坐位研墨開方扶持出入不假跟役暑日封翁喚取實地紗袍套送先生應命即取冬日喚取火狐袍套送先生並給狼皮京靴各種字帖一切奇書自刻善本各贈一套廉生遵命即取親身饋送真孝子仁人予特表而出之以為世之為子者勸吾友甯虛亭患脫肛天將奣音天空晴朗無云此處指天亮遣介來鋪敲門甚急予驚問何事來人曰虛亭脫肛請醫速去予乘輿往視診脈後開補中益氣湯一劑單後戲題七律一首敲門何事太忙忙報到虛亭患脫肛似我才稱三折背如君敢號九回腸臀無表裏難容物腹有詩書亦漏糖身價從今增十倍誰人不道是同羊彼此鼓掌大笑不藥而愈可知喜則氣上怒則氣下明矣陳薌墀楚北東湖舉人也出治雙流凡有疾患延予調治公退之暇喜談文字長於八股精於詩律並出封翁省齊老大人看云山房詩集及持家裕後楹聯朗誦之下令人敬佩敬服薌翁之出身加民克遵遺訓節用愛人禮賢下士親骨肉體民隱皆自讀父書時已定也所以累債不知細事健忘公正廉明淡泊自守今之蘭桂齊名子姪顯宦實由栽培寒士考取真材之所致也所取縣案數人一一中試雙邑士民建有長生祿位祠以志不忘予因相處最久頗知巔末柳書大概以為售案首背遺訓者戒制軍駱宮保精不化氣六脈散漫氣喘欲絕實由忠君報國殫心戎務勞心太過之所由致也治法應宜峻補正氣收攝腎陽但平日不服補劑溫熱之品止服歸芍二冬杭菊之類實於此症不宜診脈七次未服予藥星歸上界陳稚香在雙流署中患小便閉塞已經兩日醫過三人愈治癒危點不能滴其脹異常延予診視脈沉面青四肢逆冷即用開提化逆之法桔梗白蔻砂仁法夏肉桂生薑薌翁曰還用得薑桂白蔻大熱之藥否隨手解云小便止有二證一曰蓄熱一曰癃閉蓄熱宜四苓散六一散癃閉宜開提化逆膀胱有下口而無上口氣化則行用桔梗開提上氣生薑散逆白蔻砂半使中樞得運下焦自通肉桂化氣一轉運而小便自出矣遂出前方視之皆六一四苓八正散之類薌翁曰據公所論前法誤也煎服一次正飲酒時家人報曰少爺小便行矣四座皆驚均云先生之方神妙莫測靈應至此各抄存之不知抄寫成文恰合題位任脈經穴分寸歌任脈會陰兩陰間曲骨毛際陷中安中極臍下四寸取關元臍下三寸連石門臍下二寸是氣海乃在寸半間臍下一寸陰交穴臍之中央神闕傳臍上上行各一寸水分下脘建里參中脘上脘與巨闕七穴行至鳩尾邊中庭膻下寸六許膻中位在兩乳間